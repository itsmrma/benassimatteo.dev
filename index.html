    <style>
      :root {
        --font-mono: 'Geist Mono', monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        background-color: #0A0B0D;
      }

      body {
        margin: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        background-color: #0A0B0D;
        color: #FFFFFF;
        font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        min-height: 100vh;
        background-color: #0A0B0D;
      }

      /* Clean subtle scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0A0B0D;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #E10600;
      }

      /* ========================================================================= */
      /* LIVREA MOTORSPORT SYSTEM */
      /* ========================================================================= */

      /* Dynamic Lightweight Telemetry Canvas Background */
      .livrea-telemetry-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 0;
      }

      .livrea-snap-container {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
        background-color: transparent;
      }
      @media (max-width: 820px) {
        .livrea-snap-container {
          scroll-snap-type: none;
          height: 100svh;
          -webkit-overflow-scrolling: touch;
        }
      }

      /* Lap progress bar at fixed top */
      .livrea-progress-track {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }
      .livrea-progress-bar {
        height: 100%;
        background-color: #E10600;
        box-shadow: 0 0 10px rgba(225, 6, 0, 0.7);
        transition: width 0.08s linear;
      }

      /* Circuit Sector Quick-Jump Nav on Desktop Right */
      .livrea-quick-nav {
        position: fixed;
        right: 24px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 990;
        background: rgba(14, 15, 18, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 8px 6px;
        backdrop-filter: blur(12px);
      }
      @media (max-width: 1024px) {
        .livrea-quick-nav {
          display: none !important;
        }
      }
      .livrea-nav-dot {
        display: block;
        padding: 3px 6px;
        border-radius: 3px;
        text-decoration: none;
        transition: all 0.15s ease;
      }
      .livrea-nav-dot:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .livrea-nav-dot.is-active {
        background: rgba(225, 6, 0, 0.25);
        border: 1px solid #E10600;
      }

      /* Common Panel Anatomy */
      .livrea-panel {
        scroll-snap-align: start;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
        padding: 16px 80px 16px 52px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        background-color: transparent;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      @media (max-width: 1024px) {
        .livrea-panel {
          padding: 14px 22px;
          min-height: 100svh;
        }
      }
      @media (max-width: 768px) {
        .livrea-panel {
          padding: 12px 16px;
          min-height: 100svh;
          height: auto;
          scroll-snap-align: none;
        }
      }
      @media (max-width: 480px) {
        .livrea-panel {
          padding: 10px 12px;
        }
      }

      .livrea-panel-inner {
        height: 100%;
        min-height: calc(100vh - 32px);
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      @media (max-width: 1024px) {
        .livrea-panel-inner {
          min-height: calc(100svh - 28px);
        }
      }
      @media (max-width: 768px) {
        .livrea-panel-inner {
          min-height: calc(100svh - 24px);
          gap: 1rem;
        }
      }

      /* Technical Livery Header */
      .livrea-telemetry-header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 6px;
        margin-bottom: 4px;
        min-height: 24px;
      }
      @media (max-width: 640px) {
        .livrea-telemetry-header {
          padding-bottom: 5px;
          gap: 6px;
        }
      }
      .livrea-red-indicator {
        display: inline-block;
        width: 6px;
        height: 18px;
        background-color: #E10600;
        border-radius: 1px;
      }
      .livrea-kicker {
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-family: var(--font-mono);
      }
      @media (max-width: 640px) {
        .livrea-kicker {
          font-size: 0.7rem;
          letter-spacing: 0.06em;
          max-width: calc(100vw - 110px);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }
      .livrea-badge-num {
        font-family: 'Archivo', sans-serif;
        font-size: clamp(1.8rem, 4.5vw, 4rem);
        line-height: 1;
        letter-spacing: -0.03em;
        color: #E10600;
      }

      /* Big Typography */
      .livrea-huge-name {
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        line-height: 0.85;
        letter-spacing: -0.04em;
        font-size: clamp(3rem, 11vw, 9.5rem);
        margin: 0;
        color: #FFFFFF;
      }
      .livrea-massive-title {
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        line-height: 0.92;
        letter-spacing: -0.025em;
        font-size: clamp(2rem, 4.2vw, 3.8rem);
        margin: 0;
        color: #FFFFFF;
        word-break: break-word;
      }
      .livrea-split-left-col .livrea-massive-title {
        font-size: clamp(1.8rem, 3.2vw, 3rem);
      }
      .livrea-section-head {
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        font-size: clamp(1.8rem, 4vw, 3rem);
        text-transform: uppercase;
        letter-spacing: -0.02em;
        margin: 0;
        color: #FFFFFF;
      }

      /* Hero Panel 01 Details */
      .livrea-hero-center {
        margin-block: auto;
        width: 100%;
        max-width: 1550px;
      }
      .livrea-role-strip {
        font-size: 0.95rem;
        letter-spacing: 0.05em;
      }
      @media (max-width: 640px) {
        .livrea-role-strip {
          font-size: 0.78rem;
          gap: 0.35rem 0.6rem !important;
        }
      }
      .livrea-manifesto-card {
        background: #131418;
        border-left: 4px solid #E10600;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 22px 28px;
        border-radius: 0 4px 4px 0;
        max-width: 1300px;
      }
      @media (max-width: 640px) {
        .livrea-manifesto-card {
          padding: 16px 18px;
        }
        .livrea-manifesto-text {
          font-size: 1.05rem;
        }
      }
      .livrea-manifesto-text {
        font-size: clamp(1.2rem, 1.45vw, 1.45rem);
        line-height: 1.5;
        font-weight: 500;
      }
      .livrea-kpi-grid {
        margin-top: 10px;
      }
      @media (max-width: 820px) {
        .livrea-kpi-grid {
          flex-direction: column !important;
          gap: 0.75rem !important;
        }
      }
      .livrea-kpi-box {
        flex: 1;
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.09);
        padding: 18px 22px;
        border-radius: 4px;
        transition: border-color 0.15s ease;
      }
      .livrea-kpi-box:hover {
        border-color: rgba(225, 6, 0, 0.5);
      }

      /* Panel 02: The Podium */
      .livrea-podium-container {
        margin-block: auto;
        width: 100%;
        max-width: 1550px;
      }
      .livrea-podium-cards {
        margin-top: 10px;
      }
      @media (max-width: 820px) {
        .livrea-podium-cards {
          flex-direction: column !important;
          gap: 1.25rem !important;
        }
      }
      .livrea-podium-card {
        flex: 1;
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 24px;
        border-radius: 4px;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      .livrea-podium-card:hover {
        border-color: rgba(255, 255, 255, 0.25);
      }
      .livrea-podium-p1 {
        border-color: #E10600;
        background: linear-gradient(180deg, rgba(225, 6, 0, 0.12) 0%, rgba(19, 20, 24, 0.98) 100%);
      }
      .livrea-podium-rank {
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        font-size: clamp(2.4rem, 5vw, 4rem);
        line-height: 1;
      }
      .livrea-card-specs {
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 10px 14px;
        border-radius: 3px;
        margin-block: 4px;
      }

      /* Common Detail Block for Full-Width Panels (05, 06, 07) */
      .livrea-detail-block {
        margin-block: auto;
        width: 100%;
        max-width: 1550px;
      }

      /* Panels 03, 04, 05 Details & Split Media Mockups */
      .livrea-project-split-layout {
        margin-block: auto;
        width: 100%;
        max-width: 1550px;
        display: flex;
        justify-content: space-between !important;
        align-items: center;
        gap: 2.5rem;
        padding-bottom: 8px;
      }
      @media (max-width: 1024px) {
        .livrea-project-split-layout {
          flex-direction: column !important;
          gap: 1.25rem !important;
          padding-bottom: 12px;
          align-items: stretch;
        }
      }
      .livrea-split-left-col {
        flex: 1 1 450px;
        max-width: 620px;
        min-width: 0;
        width: 100%;
      }
      @media (max-width: 1024px) {
        .livrea-split-left-col {
          max-width: 100%;
        }
      }
      .livrea-split-right-col {
        flex: 1.2 1 500px;
        max-width: 840px;
        min-width: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      @media (max-width: 1024px) {
        .livrea-split-right-col {
          max-width: 100%;
          align-items: stretch;
          margin-left: 0;
        }
      }
      .livrea-project-logo {
        width: clamp(44px, 3.2vw, 58px);
        height: clamp(44px, 3.2vw, 58px);
        border-radius: 12px;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.06);
        padding: 6px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .livrea-garda-logo {
        height: 32px;
        width: auto;
        max-width: 140px;
        object-fit: contain;
      }
      .livrea-project-lead {
        font-size: clamp(0.92rem, 1.1vw, 1.1rem);
        line-height: 1.45;
        max-width: 640px;
      }
      .livrea-in-progress-tag {
        background: rgba(225, 6, 0, 0.18);
        border: 1px solid #E10600;
        padding: 2px 7px;
        border-radius: 3px;
        font-size: 0.7rem;
      }
      .livrea-pillars-list {
        margin-top: 2px;
      }
      .livrea-pillar-item {
        background: rgba(255, 255, 255, 0.02);
        border-left: 3px solid #E10600;
        padding: 5px 12px;
        border-radius: 0 4px 4px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        border-right: 1px solid rgba(255, 255, 255, 0.04);
        transition: background 0.15s ease;
      }
      .livrea-pillar-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .livrea-mockup-frame {
        background: #0E0F14;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(225, 6, 0, 0.15);
        display: flex;
        flex-direction: column;
        width: 100%;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .livrea-mockup-frame:hover {
        border-color: rgba(225, 6, 0, 0.45);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(225, 6, 0, 0.3);
      }
      .livrea-mockup-titlebar {
        background: #090A0E;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 7px 14px;
        min-height: 34px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
      }
      .livrea-app-screenshot {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #0E0F14;
      }
      /* Desktop Stage & Window Architecture (ANTEPRIME_FINESTRE) */
      .livrea-desktop-stage {
        position: relative;
        width: 100%;
        min-height: 320px;
        overflow: hidden;
        border-radius: 10px;
        background: transparent;
      }
      .livrea-desktop-stage.livrea-oxide-full-stage {
        max-width: 1550px;
        margin-block: auto;
      }
      .livrea-oxide-underlay {
        width: 100%;
        height: 100%;
        align-items: center;
        pointer-events: auto;
      }
      .livrea-stage-right-slot {
        height: 100%;
        justify-content: flex-end;
        pointer-events: none;
      }
      .livrea-stage-caption {
        margin-top: auto;
        padding-top: 8px;
        pointer-events: auto;
      }
      .livrea-desktop-stage.livrea-oxide-full-stage .livrea-desktop-window {
        z-index: 25;
      }
      @media (max-width: 1024px) {
        .livrea-desktop-stage.livrea-oxide-full-stage {
          height: auto !important;
          overflow: visible;
        }
        .livrea-oxide-underlay {
          flex-direction: column !important;
          gap: 1.25rem !important;
          height: auto !important;
        }
        .livrea-stage-right-slot {
          display: none;
        }
      }
      .livrea-desktop-stage[data-dragging="true"] {
        user-select: none !important;
        -webkit-user-select: none !important;
      }
      .livrea-desktop-stage[data-dragging="true"] iframe {
        pointer-events: none !important;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="move"] {
        cursor: grabbing;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="e"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="w"] {
        cursor: ew-resize;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="n"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="s"] {
        cursor: ns-resize;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="se"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="nw"] {
        cursor: nwse-resize;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="ne"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="sw"] {
        cursor: nesw-resize;
      }

      .livrea-desktop-window {
        position: absolute;
        top: 0;
        left: 0;
        background: #0E0F14;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(225, 6, 0, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        will-change: transform, width, height;
        box-sizing: border-box;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .livrea-desktop-window:hover {
        border-color: rgba(225, 6, 0, 0.45);
      }
      .livrea-desktop-window.is-mobile {
        position: relative !important;
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
      }

      .livrea-win-titlebar {
        background: #090A0E;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 12px;
        min-height: 32px;
        cursor: grab;
        user-select: none;
        touch-action: none;
        flex-shrink: 0;
        box-sizing: border-box;
      }
      .livrea-win-titlebar:active {
        cursor: grabbing;
      }
      .livrea-desktop-window.is-mobile .livrea-win-titlebar {
        cursor: default;
      }

      .livrea-win-controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .livrea-win-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.35);
        padding: 0;
        margin: 0;
        cursor: pointer;
        outline: none;
        transition: transform 0.12s ease, filter 0.15s ease;
      }
      .livrea-win-dot:hover {
        filter: brightness(1.2);
        transform: scale(1.1);
      }
      .livrea-win-dot:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .dot-reset { background: #FF5F56; }
      .dot-compact { background: #FFBD2E; }
      .dot-fill { background: #27C93F; }

      .livrea-win-title-text {
        font-weight: 600;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.9);
      }
      .livrea-win-tag-badge {
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(225, 6, 0, 0.15);
        border: 1px solid rgba(225, 6, 0, 0.3);
        color: #FF4D4D;
        font-size: 0.72rem;
      }
      .livrea-win-content {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
      }

      /* Internal 8-Direction Handles inside the border */
      .livrea-win-handle {
        position: absolute;
        z-index: 20;
        background: transparent;
        touch-action: none;
      }
      .livrea-win-handle-n { top: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
      .livrea-win-handle-s { bottom: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
      .livrea-win-handle-w { left: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }
      .livrea-win-handle-e { right: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }
      .livrea-win-handle-nw { top: 0; left: 0; width: 14px; height: 14px; cursor: nwse-resize; z-index: 22; }
      .livrea-win-handle-ne { top: 0; right: 0; width: 14px; height: 14px; cursor: nesw-resize; z-index: 22; }
      .livrea-win-handle-sw { bottom: 0; left: 0; width: 14px; height: 14px; cursor: nesw-resize; z-index: 22; }
      .livrea-win-handle-se {
        bottom: 0;
        right: 0;
        width: 16px;
        height: 16px;
        cursor: nwse-resize;
        z-index: 22;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 2px;
        outline: none;
      }
      .livrea-win-handle-se:focus-visible {
        outline: 2px solid var(--color-accent, #E10600);
        outline-offset: -2px;
      }
      .livrea-win-grip-indicator {
        width: 8px;
        height: 8px;
        background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.45) 40%, rgba(255, 255, 255, 0.45) 60%, transparent 60%),
                    linear-gradient(135deg, transparent 70%, rgba(255, 255, 255, 0.45) 70%);
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .livrea-desktop-window, .livrea-win-dot {
          transition: none !important;
        }
      }

      /* OS Resizable Window & 8-Direction Handles (Strict zero position shift) */
      .livrea-os-window {
        background: #0E0F14;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(225, 6, 0, 0.15);
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
        user-select: none;
        overflow: visible !important;
      }
      .livrea-os-window:hover {
        border-color: rgba(225, 6, 0, 0.45);
      }
      .livrea-os-titlebar {
        background: #090A0E;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 12px;
        min-height: 32px;
        border-radius: 8px 8px 0 0;
      }

      /* 8 Non-Shifting Collision Resize Handles */
      .livrea-handle {
        position: absolute;
        z-index: 40;
        background: transparent;
      }
      .handle-n {
        top: -6px;
        left: 12px;
        right: 12px;
        height: 12px;
        cursor: ns-resize;
      }
      .handle-s {
        bottom: -6px;
        left: 12px;
        right: 12px;
        height: 12px;
        cursor: ns-resize;
      }
      .handle-w {
        left: -6px;
        top: 12px;
        bottom: 12px;
        width: 12px;
        cursor: ew-resize;
      }
      .handle-e {
        right: -6px;
        top: 12px;
        bottom: 12px;
        width: 12px;
        cursor: ew-resize;
      }
      .handle-nw {
        top: -8px;
        left: -8px;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
        z-index: 45;
      }
      .handle-ne {
        top: -8px;
        right: -8px;
        width: 18px;
        height: 18px;
        cursor: nesw-resize;
        z-index: 45;
      }
      .handle-sw {
        bottom: -8px;
        left: -8px;
        width: 18px;
        height: 18px;
        cursor: nesw-resize;
        z-index: 45;
      }
      .handle-se {
        bottom: -8px;
        right: -8px;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
        z-index: 45;
      }
      .handle-n:hover, .handle-s:hover, .handle-w:hover, .handle-e:hover {
        background: rgba(225, 6, 0, 0.25);
      }
      .handle-nw:hover, .handle-ne:hover, .handle-sw:hover, .handle-se:hover {
        background: rgba(225, 6, 0, 0.5);
        border-radius: 2px;
      }

      .livrea-mode-btn {
