<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matteo Benassi — Computer Engineering &amp; Systems Developer</title>
    <meta
      name="description"
      content="Portfolio of Matteo Benassi — Computer Engineering B.Sc. student at UNIMORE (125/180 ECTS, Weighted Avg 27.3/30 · 2 Honors), Oxide &amp; SyncForge Rust developer, 3x hackathon podium winner, and aspiring Motorsport software engineer."
    />
    <meta name="author" content="Matteo Benassi" />
    <meta name="theme-color" content="#090d16" />
    <link rel="canonical" href="https://benassimatteo.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://benassimatteo.dev/" />
    <meta property="og:title" content="Matteo Benassi — Computer Engineering &amp; Systems Developer" />
    <meta
      property="og:description"
      content="Computer Engineering @ UNIMORE (125/180 ECTS · Avg 27.3/30 · 2 Honors) · Oxide &amp; SyncForge Rust/Tauri Developer · 1st Place Hack4Water 2026 &amp; 2x SCIoTeM Podiums."
    />

    <!-- Google Fonts for Prototypes A (Newsreader, IBM Plex Mono), B (Archivo), C (Geist, Geist Mono), D (Instrument Serif, Instrument Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --font-mono: 'Geist Mono', monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        background-color: #0A0B0D;
      }

      body {
        margin: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        background-color: #0A0B0D;
        color: #FFFFFF;
        font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        min-height: 100vh;
        background-color: #0A0B0D;
      }

      /* Clean subtle scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0A0B0D;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #E10600;
      }

      /* ========================================================================= */
      /* LIVREA MOTORSPORT SYSTEM */
      /* ========================================================================= */
      .livrea-snap-container {
        width: 100%;
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
        background-color: #0A0B0D;
      }
      @media (max-width: 820px) {
        .livrea-snap-container {
          scroll-snap-type: y proximity;
        }
      }

      /* Lap progress bar at fixed top */
      .livrea-progress-track {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }
      .livrea-progress-bar {
        height: 100%;
        background-color: #E10600;
        box-shadow: 0 0 10px rgba(225, 6, 0, 0.7);
        transition: width 0.08s linear;
      }

      /* Lap counter indicator fixed in bottom-left */
      .livrea-panel-counter {
        position: fixed;
        bottom: 24px;
        left: 28px;
        z-index: 999;
        font-family: var(--font-mono);
        background: rgba(14, 15, 18, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.14);
        padding: 6px 14px;
        border-radius: 4px;
        backdrop-filter: blur(12px);
        pointer-events: none;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      }
      .livrea-counter-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #E10600;
        box-shadow: 0 0 8px #E10600;
      }
      .livrea-counter-tag {
        border-left: 1px solid rgba(255, 255, 255, 0.15);
        padding-left: 8px;
        text-transform: uppercase;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
      }

      /* Circuit Sector Quick-Jump Nav on Desktop Right */
      .livrea-quick-nav {
        position: fixed;
        right: 24px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 990;
        background: rgba(14, 15, 18, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 8px 6px;
        backdrop-filter: blur(12px);
      }
      @media (max-width: 1024px) {
        .livrea-quick-nav {
          display: none !important;
        }
      }
      .livrea-nav-dot {
        display: block;
        padding: 3px 6px;
        border-radius: 3px;
        text-decoration: none;
        transition: all 0.15s ease;
      }
      .livrea-nav-dot:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .livrea-nav-dot.is-active {
        background: rgba(225, 6, 0, 0.25);
        border: 1px solid #E10600;
      }

      /* Common Panel Anatomy */
      .livrea-panel {
        scroll-snap-align: start;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
        padding: 32px 84px 32px 56px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        background-color: #0A0B0D;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      @media (max-width: 1024px) {
        .livrea-panel {
          padding: 28px 24px;
          min-height: 100svh;
        }
      }
      .livrea-panel-inner {
        height: 100%;
        min-height: calc(100vh - 64px);
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      @media (max-width: 1024px) {
        .livrea-panel-inner {
          min-height: calc(100svh - 56px);
        }
      }

      /* Technical Livery Header */
      .livrea-telemetry-header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 12px;
      }
      .livrea-red-indicator {
        display: inline-block;
        width: 6px;
        height: 18px;
        background-color: #E10600;
        border-radius: 1px;
      }
      .livrea-kicker {
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-family: var(--font-mono);
      }
      .livrea-badge-num {
        font-family: 'Archivo', sans-serif;
        font-size: clamp(2rem, 4.5vw, 4rem);
        line-height: 1;
        letter-spacing: -0.03em;
        color: #E10600;
      }

      /* Big Typography */
      .livrea-huge-name {
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        line-height: 0.85;
        letter-spacing: -0.04em;
        font-size: clamp(3rem, 11vw, 9.5rem);
        margin: 0;
        color: #FFFFFF;
      }
      .livrea-massive-title {
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        line-height: 0.88;
        letter-spacing: -0.03em;
        font-size: clamp(2.2rem, 6.5vw, 5.5rem);
        margin: 0;
        color: #FFFFFF;
      }
      .livrea-section-head {
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        font-size: clamp(1.8rem, 4vw, 3rem);
        text-transform: uppercase;
        letter-spacing: -0.02em;
        margin: 0;
        color: #FFFFFF;
      }

      /* Hero Panel 01 Details */
      .livrea-hero-center {
        margin-block: auto;
        width: 100%;
        max-width: 1550px;
      }
      .livrea-role-strip {
        font-size: 0.95rem;
        letter-spacing: 0.05em;
      }
      .livrea-manifesto-card {
        background: #131418;
        border-left: 4px solid #E10600;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 22px 28px;
        border-radius: 0 4px 4px 0;
        max-width: 1300px;
      }
      .livrea-manifesto-text {
        font-size: clamp(1.2rem, 1.45vw, 1.45rem);
        line-height: 1.5;
        font-weight: 500;
      }
      .livrea-kpi-grid {
        margin-top: 10px;
      }
      @media (max-width: 820px) {
        .livrea-kpi-grid {
          flex-direction: column !important;
          gap: 0.75rem !important;
        }
      }
      .livrea-kpi-box {
        flex: 1;
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.09);
        padding: 18px 22px;
        border-radius: 4px;
        transition: border-color 0.15s ease;
      }
      .livrea-kpi-box:hover {
        border-color: rgba(225, 6, 0, 0.5);
      }

      /* Panel 02: The Podium */
      .livrea-podium-container {
        margin-block: auto;
        width: 100%;
        max-width: 1550px;
      }
      .livrea-podium-cards {
        margin-top: 10px;
      }
      @media (max-width: 820px) {
        .livrea-podium-cards {
          flex-direction: column !important;
          gap: 1.25rem !important;
        }
      }
      .livrea-podium-card {
        flex: 1;
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 24px;
        border-radius: 4px;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      .livrea-podium-card:hover {
        border-color: rgba(255, 255, 255, 0.25);
      }
      .livrea-podium-p1 {
        border-color: #E10600;
        background: linear-gradient(180deg, rgba(225, 6, 0, 0.12) 0%, rgba(19, 20, 24, 0.98) 100%);
      }
      .livrea-podium-rank {
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        font-size: clamp(2.4rem, 5vw, 4rem);
        line-height: 1;
      }
      .livrea-card-specs {
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 10px 14px;
        border-radius: 3px;
        margin-block: 4px;
      }

      /* Common Detail Block for Full-Width Panels (05, 06, 07) */
      .livrea-detail-block {
        margin-block: auto;
        width: 100%;
        max-width: 1550px;
      }

      /* Panels 03 & 04 Details & Split Media Mockups */
      .livrea-project-split-layout {
        margin-block: auto;
        width: 100%;
        max-width: 100%;
        justify-content: space-between !important;
        align-items: center;
      }
      @media (max-width: 1024px) {
        .livrea-project-split-layout {
          flex-direction: column !important;
          gap: 1.5rem !important;
        }
      }
      .livrea-split-left-col {
        flex: 1 1 520px;
        max-width: 780px;
        width: 100%;
      }
      @media (max-width: 1024px) {
        .livrea-split-left-col {
          max-width: 100%;
        }
      }
      .livrea-split-right-col {
        flex: 1.35 1 580px;
        width: 100%;
        max-width: min(1180px, calc((100vh - 220px) * 1.6));
        margin-left: auto;
      }
      @media (max-width: 1024px) {
        .livrea-split-right-col {
          max-width: 100%;
          margin-left: 0;
        }
      }
      .livrea-project-logo {
        width: clamp(60px, 4.5vw, 76px);
        height: clamp(60px, 4.5vw, 76px);
        border-radius: 14px;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.06);
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .livrea-garda-logo {
        height: 32px;
        width: auto;
        max-width: 140px;
        object-fit: contain;
      }
      .livrea-project-lead {
        font-size: clamp(1.15rem, 1.35vw, 1.35rem);
        line-height: 1.55;
        max-width: 760px;
      }
      .livrea-in-progress-tag {
        background: rgba(225, 6, 0, 0.18);
        border: 1px solid #E10600;
        padding: 3px 8px;
        border-radius: 3px;
        font-size: 0.72rem;
      }
      .livrea-pillars-list {
        margin-top: 4px;
      }
      .livrea-pillar-item {
        background: rgba(255, 255, 255, 0.02);
        border-left: 3px solid #E10600;
        padding: 10px 16px;
        border-radius: 0 4px 4px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        border-right: 1px solid rgba(255, 255, 255, 0.04);
        transition: background 0.15s ease;
      }
      .livrea-pillar-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .livrea-mockup-frame {
        background: #141519;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      }
      .livrea-mockup-titlebar {
        background: #0E0F12;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 14px;
      }
      .livrea-window-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .dot-red {
        background: #FF5F56;
      }
      .dot-yellow {
        background: #FFBD2E;
      }
      .dot-green {
        background: #27C93F;
      }
      .livrea-window-title {
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .livrea-app-screenshot {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .livrea-primary-action-btn {
        background: #E10600 !important;
        color: #FFFFFF !important;
        font-weight: 800 !important;
        border: none !important;
      }
      .livrea-action-note {
        align-self: center;
      }

      /* Panel 05 Split Architecture */
      .livrea-split-engineering {
        margin-top: 8px;
      }
      @media (max-width: 820px) {
        .livrea-split-engineering {
          flex-direction: column !important;
          gap: 1.25rem !important;
        }
      }
      .livrea-system-split-box {
        flex: 1;
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 24px;
        border-radius: 4px;
      }

      /* Panel 06 Machinery */
      .livrea-machinery-grid {
        margin-top: 8px;
      }
      @media (max-width: 820px) {
        .livrea-machinery-grid {
          flex-direction: column !important;
          gap: 1rem !important;
        }
      }
      .livrea-machinery-col {
        flex: 1;
      }
      .livrea-machinery-card {
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 16px 20px;
        border-radius: 4px;
        transition: border-color 0.15s ease;
      }
      .livrea-machinery-card:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* Panel 07 Starting Grid */
      .livrea-grid-rows {
        margin-top: 8px;
      }
      .livrea-grid-row {
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 16px 24px;
        border-radius: 4px;
        transition: border-color 0.15s ease;
      }
      .livrea-grid-row:hover {
        border-color: rgba(225, 6, 0, 0.4);
      }
      .livrea-grid-pos {
        font-family: var(--font-mono);
        font-weight: 900;
        font-size: 1.3rem;
        width: 50px;
        flex-shrink: 0;
      }

      /* Panel 08 Redesigned Contact Section */
      .livrea-contact-center {
        margin-block: auto;
        width: 100%;
        max-width: 1550px;
      }
      .livrea-contact-lead {
        font-size: clamp(1.15rem, 1.35vw, 1.35rem);
        line-height: 1.55;
        max-width: 1000px;
      }
      .livrea-contact-cards-grid {
        margin-top: 10px;
      }
      @media (max-width: 900px) {
        .livrea-contact-cards-grid {
          flex-direction: column !important;
          gap: 1rem !important;
        }
      }
      .livrea-contact-card {
        flex: 1;
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 22px;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 10px;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .livrea-contact-card:hover {
        border-color: rgba(255, 255, 255, 0.25);
      }
      .livrea-contact-card.is-primary-action {
        border-color: #E10600;
        background: linear-gradient(180deg, rgba(225, 6, 0, 0.1) 0%, rgba(19, 20, 24, 0.98) 100%);
      }

      /* Bottom Navigation Strip — padded on left to never collide with fixed bottom-left counter HUD */
      .livrea-bottom-strip {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 14px;
        padding-left: 210px;
      }
      @media (max-width: 900px) {
        .livrea-bottom-strip {
          padding-left: 0;
        }
        .livrea-panel-counter {
          display: none;
        }
      }
      .livrea-scroll-hint {
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
