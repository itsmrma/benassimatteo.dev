    <style>
      /* ===================================================================== */
      /* Legacy desktop-window prototypes (src/components/desktop, not mounted) */
      /* ===================================================================== */
      /* Desktop Stage & Window Architecture (ANTEPRIME_FINESTRE) */
      .livrea-desktop-stage {
        position: relative;
        width: 100%;
        min-height: 320px;
        overflow: hidden;
        border-radius: 10px;
        background: transparent;
      }
      .livrea-desktop-stage.livrea-oxide-full-stage {
        max-width: 1550px;
        margin-block: auto;
      }
      .livrea-oxide-underlay {
        width: 100%;
        height: 100%;
        align-items: center;
        pointer-events: auto;
      }
      .livrea-stage-right-slot {
        height: 100%;
        justify-content: flex-end;
        pointer-events: none;
      }
      .livrea-stage-caption {
        margin-top: 8px;
        padding-top: 2px;
        pointer-events: auto;
      }
      .livrea-desktop-stage.livrea-oxide-full-stage .livrea-desktop-window {
        z-index: 25;
      }
      @media (max-width: 1024px) {
        .livrea-desktop-stage.livrea-oxide-full-stage {
          height: auto !important;
          overflow: visible;
        }
        .livrea-oxide-underlay {
          flex-direction: column !important;
          gap: 1.25rem !important;
          height: auto !important;
        }
        .livrea-stage-right-slot {
          display: none;
        }
      }
      .livrea-desktop-stage[data-dragging="true"] {
        user-select: none !important;
        -webkit-user-select: none !important;
      }
      .livrea-desktop-stage[data-dragging="true"] iframe {
        pointer-events: none !important;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="move"] {
        cursor: grabbing;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="e"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="w"] {
        cursor: ew-resize;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="n"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="s"] {
        cursor: ns-resize;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="se"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="nw"] {
        cursor: nwse-resize;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="ne"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="sw"] {
        cursor: nesw-resize;
      }

      .livrea-desktop-window {
        position: absolute;
        top: 0;
        left: 0;
        background: #10131A;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        will-change: transform, width, height;
        box-sizing: border-box;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .livrea-desktop-window:hover {
        border-color: rgba(236, 237, 239, 0.16);
      }
      .livrea-desktop-window.is-mobile {
        position: relative !important;
        width: 100% !important;
        height: auto !important;
        aspect-ratio: 16 / 10 !important;
        min-height: 240px;
        transform: none !important;
      }
      .livrea-desktop-window.is-mobile .livrea-win-controls {
        display: none !important;
      }
      .livrea-desktop-window.is-mobile .livrea-win-handle {
        display: none !important;
      }

      /* Touch-safe Oxide Showcase & Fullscreen Modal */
      .livrea-app-preview-mobile {
        user-select: none;
        touch-action: pan-y;
      }
      .livrea-showcase-pills {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .livrea-showcase-pill {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
        outline: none;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .livrea-showcase-pill:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.25);
      }
      .livrea-showcase-pill.is-active {
        background: rgba(236, 237, 239, 0.06);
        border-color: rgba(236, 237, 239, 0.16);
      }
      .livrea-showcase-detail {
        background: rgba(14, 15, 20, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        padding: 8px 10px;
        box-sizing: border-box;
      }
      .livrea-showcase-desc {
        line-height: 1.35;
        font-size: 0.8rem;
      }
      .livrea-showcase-spec {
        font-size: 0.72rem;
        letter-spacing: 0.02em;
      }
      .livrea-fullscreen-demo-btn {
        min-height: 38px;
        font-weight: 600;
      }
      .livrea-showcase-note {
        font-size: 0.72rem;
        letter-spacing: 0.02em;
      }
      .livrea-fullscreen-modal {
        animation: livrea-fade-in 0.2s ease-out;
      }
      @keyframes livrea-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .livrea-win-titlebar {
        background: #0D0E13;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 12px;
        min-height: 32px;
        cursor: grab;
        user-select: none;
        touch-action: none;
        flex-shrink: 0;
        box-sizing: border-box;
      }
      .livrea-win-titlebar:active {
        cursor: grabbing;
      }
      .livrea-desktop-window.is-mobile .livrea-win-titlebar {
        cursor: default;
      }

      .livrea-win-controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .livrea-win-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.35);
        padding: 0;
        margin: 0;
        cursor: pointer;
        outline: none;
        transition: transform 0.12s ease, filter 0.15s ease;
      }
      .livrea-win-dot:hover {
        filter: brightness(1.2);
        transform: scale(1.1);
      }
      .livrea-win-dot:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .dot-reset { background: #FF5F56; }
      .dot-compact { background: #FFBD2E; }
      .dot-fill { background: #27C93F; }

      .livrea-win-title-text {
        font-weight: 600;
        letter-spacing: 0.03em;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.9);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      @media (max-width: 640px) {
        .livrea-win-title-text {
          font-size: 0.7rem;
          max-width: 220px;
        }
      }
      .livrea-win-tag-badge {
        padding: 2px 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #9A9EA8;
        font-size: 0.7rem;
        letter-spacing: 0.04em;
        flex-shrink: 0;
      }
      .livrea-win-content {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
      }

      /* Internal 8-Direction Handles inside the border */
      .livrea-win-handle {
        position: absolute;
        z-index: 20;
        background: transparent;
        touch-action: none;
      }
      .livrea-win-handle-n { top: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
      .livrea-win-handle-s { bottom: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
      .livrea-win-handle-w { left: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }
      .livrea-win-handle-e { right: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }
      .livrea-win-handle-nw { top: 0; left: 0; width: 14px; height: 14px; cursor: nwse-resize; z-index: 22; }
      .livrea-win-handle-ne { top: 0; right: 0; width: 14px; height: 14px; cursor: nesw-resize; z-index: 22; }
      .livrea-win-handle-sw { bottom: 0; left: 0; width: 14px; height: 14px; cursor: nesw-resize; z-index: 22; }
      .livrea-win-handle-se {
        bottom: 0;
        right: 0;
        width: 16px;
        height: 16px;
        cursor: nwse-resize;
        z-index: 22;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 2px;
        outline: none;
      }
      .livrea-win-handle-se:focus-visible {
        outline: 2px solid var(--color-accent, var(--color-text-red));
        outline-offset: -2px;
      }
      .livrea-win-grip-indicator {
        width: 8px;
        height: 8px;
        background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.45) 40%, rgba(255, 255, 255, 0.45) 60%, transparent 60%),
                    linear-gradient(135deg, transparent 70%, rgba(255, 255, 255, 0.45) 70%);
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .livrea-desktop-window, .livrea-win-dot {
          transition: none !important;
        }
      }

      /* OS Resizable Window & 8-Direction Handles (Strict zero position shift) */
      .livrea-os-window {
        background: #10131A;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
        user-select: none;
        overflow: visible !important;
      }
      .livrea-os-window:hover {
        border-color: rgba(236, 237, 239, 0.16);
      }
      .livrea-os-titlebar {
        background: #0D0E13;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 12px;
        min-height: 32px;
        border-radius: 8px 8px 0 0;
      }

      /* 8 Non-Shifting Collision Resize Handles */
      .livrea-handle {
        position: absolute;
        z-index: 40;
        background: transparent;
      }
      .handle-n {
        top: -6px;
        left: 12px;
        right: 12px;
        height: 12px;
        cursor: ns-resize;
      }
      .handle-s {
        bottom: -6px;
        left: 12px;
        right: 12px;
        height: 12px;
        cursor: ns-resize;
      }
      .handle-w {
        left: -6px;
        top: 12px;
        bottom: 12px;
        width: 12px;
        cursor: ew-resize;
      }
      .handle-e {
        right: -6px;
        top: 12px;
        bottom: 12px;
        width: 12px;
        cursor: ew-resize;
      }
      .handle-nw {
        top: -8px;
        left: -8px;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
        z-index: 45;
      }
      .handle-ne {
        top: -8px;
        right: -8px;
        width: 18px;
        height: 18px;
        cursor: nesw-resize;
        z-index: 45;
      }
      .handle-sw {
        bottom: -8px;
        left: -8px;
        width: 18px;
        height: 18px;
        cursor: nesw-resize;
        z-index: 45;
      }
      .handle-se {
        bottom: -8px;
        right: -8px;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
        z-index: 45;
      }
      .handle-n:hover, .handle-s:hover, .handle-w:hover, .handle-e:hover {
        background: rgba(236, 237, 239, 0.06);
      }
      .handle-nw:hover, .handle-ne:hover, .handle-sw:hover, .handle-se:hover {
        background: rgba(236, 237, 239, 0.16);
        border-radius: 2px;
      }

      .livrea-mode-btn {
        font-size: 0.65rem !important;
        height: 20px !important;
        padding: 0 6px !important;
        border-radius: 3px !important;
      }
      .livrea-mode-btn.is-active {
        background: rgba(236, 237, 239, 0.06) !important;
        color: #FFFFFF !important;
        border: 1px solid var(--color-text-red) !important;
      }

      .livrea-resize-indicator {
        background: rgba(236, 237, 239, 0.06);
        border: 1px solid var(--color-text-red);
        padding: 1px 5px;
        border-radius: 2px;
        font-size: 0.65rem;
      }
      .livrea-window-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        transition: opacity 0.15s ease;
      }
      .livrea-window-dot:hover {
        opacity: 0.8;
      }
      .dot-red {
        background: #FF5F56;
      }
      .dot-yellow {
        background: #FFBD2E;
      }
      .dot-green {
        background: #27C93F;
      }
      .livrea-window-title {
        font-size: 0.7rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* ===================================================================== */
      /* Interactive Application Common Styles                                 */
      /* ===================================================================== */
      .livrea-app-viewport {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0A0C11;
        border-radius: 0 0 7px 7px;
        display: flex;
        flex-direction: column;
      }

      /* SyncForge Desktop Styles */
      .sf-app-root {
        background: #0E1016;
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .sf-toast-bar {
        background: rgba(236, 237, 239, 0.06);
        border-bottom: 1px solid var(--color-text-red);
        padding: 4px 10px;
        font-size: 0.72rem;
      }
      .sf-app-header {
        background: #0C0E14;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 12px;
      }
      .sf-mcp-badge {
        background: rgba(39, 201, 63, 0.15);
        border: 1px solid #27C93F;
        padding: 1px 6px;
        border-radius: 3px;
        font-size: 0.65rem;
      }
      .sf-hub-stage {
        padding: 14px 18px;
        box-sizing: border-box;
      }
      .sf-hub-center {
        margin-block: auto;
      }
      .sf-hero-icon-box {
        width: 64px;
        height: 64px;
        background: #161922;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
        margin-bottom: 4px;
      }
      .sf-hero-title {
        font-family: 'Archivo', sans-serif;
        font-size: 1.55rem;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .sf-pills-row {
        margin-top: 4px;
      }
      .sf-pill {
        background: #15161C;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 3px 8px;
        border-radius: 4px;
        color: #A0A5B5;
        font-size: 0.68rem;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .sf-pill:hover {
        background: rgba(236, 237, 239, 0.06);
        border-color: var(--color-text-red);
        color: #FFFFFF;
      }
      .sf-hub-action-strip {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 10px;
      }
      .sf-cta-btn {
        background: var(--color-text-red) !important;
        color: #FFFFFF !important;
        font-weight: 500 !important;
        font-size: 0.72rem !important;
        height: 28px !important;
        padding: 0 12px !important;
      }
      .sf-mini-btn {
        font-size: 0.68rem !important;
        height: 24px !important;
        padding: 0 8px !important;
      }
      .sf-inspector-stage {
        padding: 10px 14px;
        box-sizing: border-box;
      }
      .sf-inspector-header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 6px;
      }
      .sf-sync-status-badge {
        background: rgba(236, 237, 239, 0.06);
        border: 1px solid var(--color-text-red);
        padding: 2px 7px;
        border-radius: 3px;
      }
      .sf-tracks-table {
        background: #0C0E14;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        padding: 4px 8px;
      }
      .sf-track-row {
        padding: 4px 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 2px;
      }
      .sf-track-row:last-child {
        border-bottom: none;
      }
      .sf-track-row.is-selected {
        background: rgba(236, 237, 239, 0.06);
        border: 1px solid rgba(236, 237, 239, 0.06);
      }
      .sf-waveform-box {
        background: #0A0C11;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 12px;
        border-radius: 4px;
      }
      .sf-wave-track {
        flex: 1;
        height: 26px;
        display: flex;
        align-items: center;
        overflow: hidden;
      }
      .sf-inspector-footer {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 8px;
      }
      .sf-player-stage {
        padding: 12px 14px;
        box-sizing: border-box;
      }
      .sf-cinema-screen {
        background: #050608;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        height: 190px;
        width: 100%;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.95);
      }
      .sf-subtitle-rendered {
        color: #FFE600;
        font-size: 1.05rem;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
        margin-top: 18px;
      }

      /* Oxide Desktop Styles */
      .ox-app-root {
        background: #0F1218;
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .ox-toast-bar {
        background: rgba(236, 237, 239, 0.06);
        border-bottom: 1px solid var(--color-text-red);
        padding: 3px 10px;
      }
      .ox-app-menubar {
        background: #0C0E14;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 5px 12px;
        min-height: 30px;
      }
      .ox-diff-pill {
        background: rgba(39, 201, 63, 0.15);
        color: #27C93F;
        padding: 1px 6px;
        border-radius: 2px;
        font-size: 0.65rem;
      }
      .ox-commit-btn {
        background: var(--color-text-red) !important;
        color: #FFFFFF !important;
        font-weight: 500 !important;
        font-size: 0.66rem !important;
        height: 24px !important;
        padding: 0 8px !important;
      }
      .ox-workspace-split {
        height: calc(100% - 30px);
      }
      .ox-threads-col {
        width: 175px;
        flex-shrink: 0;
        background: #0D0E13;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px;
        box-sizing: border-box;
      }
      .ox-sidebar-head {
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .ox-threads-list {
        flex: 1;
        overflow-y: auto;
      }
      .ox-thread-item {
        padding: 5px 6px;
        border-radius: 3px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .ox-thread-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .ox-thread-item.is-active {

      }
      .ox-chat-col {

        background: #0E1016;
        padding: 8px 12px;
        box-sizing: border-box;
      }
      .ox-chat-header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 4px;
      }
      .ox-messages-scroll {
        flex: 1;
        overflow-y: auto;
        padding-right: 4px;
      }
      .ox-user-bubble {
        background: #161922;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 10px;
        border-radius: 4px;
      }
      .ox-agent-bubble {
        background: #13151D;
        border-left: 2px solid var(--color-text-red);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        border-right: 1px solid rgba(255, 255, 255, 0.08);

      }
      .ox-input-bar {
        background: #161922;
        border: 1px solid rgba(255, 255, 255, 0.08);

        flex-shrink: 0;
        background: #0C0E14;
        border-left: 1px solid rgba(255, 255, 255, 0.08);

      }

        padding-bottom: 4px;
      }
      .ox-diff-content {
        flex: 1;
        overflow-y: auto;
        font-family: var(--font-mono);
        font-size: 0.65rem;
      }
      .ox-diff-del {
        color: #FF5F56 !important;
        background: rgba(255, 95, 86, 0.1);
        padding: 1px 2px;
      }
      .ox-diff-add {
        color: #27C93F !important;
        background: rgba(39, 201, 63, 0.1);
        padding: 1px 2px;
      }
      .ox-cta-btn {
        background: var(--color-text-red) !important;
        color: #FFFFFF !important;
        font-weight: 500 !important;
        font-size: 0.68rem !important;
        height: 24px !important;
        padding: 0 10px !important;
      }
      .ox-mini-btn {
        font-size: 0.65rem !important;
        height: 22px !important;
        padding: 0 6px !important;
      }

      /* scrobbl.rs Dashboard Styles */
      .sc-app-root {
        background: #0E1016;
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .sc-toast-bar {
        background: rgba(236, 237, 239, 0.06);
        border-bottom: 1px solid var(--color-text-red);
        padding: 3px 10px;
      }
      .sc-app-menubar {
        background: #0D0E13;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 12px;
        min-height: 32px;
      }
      .sc-period-btn {
        font-size: 0.65rem !important;
        height: 22px !important;
        padding: 0 6px !important;
        border-radius: 3px !important;
      }
      .sc-period-btn.is-active {
        background: rgba(236, 237, 239, 0.06) !important;
        border: 1px solid var(--color-text-red) !important;
        color: #FFFFFF !important;
      }
      .sc-dashboard-body {
        padding: 10px 14px;
        box-sizing: border-box;
        height: calc(100% - 32px);
      }
      .sc-kpi-row {
        margin-block: 2px;
      }
      .sc-kpi-card {
        flex: 1;
        background: #13151D;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 12px;
        border-radius: 4px;
      }
      .sc-kpi-val {
        font-family: 'Archivo', sans-serif;
        font-size: 1.4rem;
        letter-spacing: -0.02em;
        line-height: 1;
        margin-bottom: 2px;
      }
      .sc-top-artists-box {
        background: #0D0E13;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 10px;
        border-radius: 4px;
      }
      .sc-artist-bars {
        margin-top: 4px;
      }
      .sc-artist-row {
        padding: 2px 0;
      }
      .sc-bar-track {
        flex: 1;
        height: 6px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 3px;
        overflow: hidden;
        margin-inline: 8px;
      }
      .sc-bar-fill {
        height: 100%;
        background: var(--color-text-red);
        border-radius: 3px;
      }
      .sc-dashboard-footer {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 6px;
      }
      .sc-cta-btn {
        background: var(--color-text-red) !important;
        color: #FFFFFF !important;
        font-weight: 500 !important;
        font-size: 0.68rem !important;
        height: 24px !important;
        padding: 0 10px !important;
      }


      /* ===================================================================== */
      /* LIVREA — carbon pit-wall layout                                        */
      /* Colors come from the Astryx theme (src/themes.ts). Only html/body use  */
      /* a literal, because they sit outside the <Theme> scope.                 */
      /* Spacing on a 4px grid · one easing curve · red = livery mark only      */
      /* ===================================================================== */

      :root {
        --livrea-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --livrea-display: 'Space Grotesk', 'Archivo', sans-serif;
        --livrea-hud-height: 52px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        background-color: #0E0F12;
      }

      body {
        margin: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        background-color: #0E0F12;
        color: #ECEDEF;
        font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        min-height: 100vh;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(236, 237, 239, 0.12);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(236, 237, 239, 0.24);
      }

      :focus-visible {
        outline: 2px solid var(--color-text-primary);
        outline-offset: 2px;
      }

      /* Background: static CAD grid with a few neutral nodes (TelemetryBackground) */
      .livrea-telemetry-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 0;
      }

      /* ---------------------------------------------------------------- */
      /* Scroll model                                                      */
      /* ---------------------------------------------------------------- */
      .livrea-snap-container {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
        background-color: transparent;
      }

      @media (min-width: 820px) and (pointer: fine) {
        html, body {
          height: 100%;
          overflow: hidden;
        }
      }

      @media (max-width: 819.98px), (pointer: coarse) {
        html {
          height: auto;
          min-height: 100%;
          overflow-y: auto;
        }
        body {
          height: auto;
          min-height: 100%;
          overflow-y: visible;
          overflow-x: hidden;
        }
        #root {
          height: auto;
          min-height: 100%;
        }
        .livrea-snap-container {
          height: auto !important;
          min-height: 100% !important;
          overflow: visible !important;
          scroll-snap-type: none !important;
        }
      }

      /* ---------------------------------------------------------------- */
      /* Progress line and desktop rail                                    */
      /* ---------------------------------------------------------------- */
      .livrea-progress-track {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        z-index: 1000;
        background: transparent;
        pointer-events: none;
      }
      .livrea-progress-bar {
        display: block;
        height: 100%;
        font-size: 0;
        background-color: var(--color-text-red);
        transition: width 80ms linear;
      }

      .livrea-quick-nav {
        position: fixed;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 990;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid transparent;
        transition: background-color 160ms var(--livrea-ease), border-color 160ms var(--livrea-ease);
      }
      .livrea-quick-nav:hover,
      .livrea-quick-nav:focus-within {
        background: var(--color-background-card);
        border-color: var(--color-border);
      }
      @media (max-width: 819.98px), (pointer: coarse) {
        .livrea-quick-nav {
          display: none !important;
        }
      }
      .livrea-nav-dot {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 32px;
        padding: 0 12px 0 16px;
        border-radius: 6px;
        text-decoration: none;
        position: relative;
        transition: color 150ms var(--livrea-ease), background-color 150ms var(--livrea-ease);
      }
      .livrea-nav-dot:hover {
        background: var(--color-background-muted);
        color: var(--color-text-primary);
      }
      .livrea-nav-dot.is-active::before {
        content: '';
        position: absolute;
        left: 4px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        border-radius: 1px;
        background: var(--color-text-red);
      }
      .livrea-nav-label {
        display: none;
        margin-left: 12px;
        white-space: nowrap;
      }
      .livrea-quick-nav:hover .livrea-nav-label,
      .livrea-quick-nav:focus-within .livrea-nav-label {
        display: inline;
      }

      /* ---------------------------------------------------------------- */
      /* Mobile section bar + bottom sheet                                 */
      /* ---------------------------------------------------------------- */
      .livrea-mobile-hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 998;
        background: var(--color-background-body);
        border-bottom: 1px solid var(--color-border);
      }
      @media (min-width: 820px) and (pointer: fine) {
        .livrea-mobile-hud {
          display: none !important;
        }
      }
      .livrea-mobile-hud-bar {
        height: var(--livrea-hud-height);
        padding: 0 12px 0 4px;
      }
      .livrea-hud-trigger {
        min-height: 44px;
        padding-inline: 12px !important;
      }
      .livrea-hud-trigger-num {
        color: var(--color-text-red);
      }
      .livrea-hud-trigger-title {
        font-family: var(--livrea-display);
        white-space: nowrap;
      }
      .livrea-hud-contact {
        min-height: 36px;
      }

      .livrea-sheet {
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
      .livrea-sheet-head {
        width: 100%;
        padding: 4px 20px 12px;
        border-bottom: 1px solid var(--color-border);
      }
      .livrea-sheet-row {
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 56px;
        padding: 8px 20px;
        text-decoration: none !important;
        position: relative;
        transition: background-color 150ms var(--livrea-ease);
        -webkit-tap-highlight-color: transparent;
      }
      .livrea-sheet-row + .livrea-sheet-row {
        border-top: 1px solid var(--color-border);
      }
      .livrea-sheet-row:active,
      .livrea-sheet-row:hover {
        background: var(--color-background-muted);
      }
      .livrea-sheet-row.is-active {
        background: var(--color-background-muted);
      }
      .livrea-sheet-row.is-active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 12px;
        bottom: 12px;
        width: 2px;
        background: var(--color-text-red);
      }
      .livrea-sheet-num {
        width: 24px;
        flex-shrink: 0;
        color: var(--color-text-secondary);
        font-variant-numeric: tabular-nums;
      }
      .livrea-sheet-row.is-active .livrea-sheet-num {
        color: var(--color-text-red);
      }
      .livrea-sheet-row > * {
        flex: 1 1 auto;
        width: 100%;
      }
      .livrea-sheet-text {
        min-width: 0;
      }

      /* ---------------------------------------------------------------- */
      /* Panel anatomy                                                     */
      /* ---------------------------------------------------------------- */
      .livrea-panel {
        scroll-snap-align: start;
        min-height: 100vh;
        width: 100%;
        padding: 24px 96px 24px 48px;
        display: flex;
        flex-direction: column;
        position: relative;
        background-color: transparent;
        border-bottom: 1px solid var(--color-border);
      }
      .livrea-panel-inner {
        min-height: calc(100vh - 48px);
        gap: 24px;
      }
      .livrea-hero-center,
      .livrea-podium-container,
      .livrea-detail-block,
      .livrea-project-split-layout,
      .livrea-contact-center {
        margin-block: auto;
        width: 100%;
        max-width: 1440px;
      }

      @media (max-width: 1024px) {
        .livrea-panel {
          padding: 24px 32px;
          min-height: auto;
        }
        .livrea-panel-inner {
          min-height: auto;
        }
      }

      @media (max-width: 819.98px), (pointer: coarse) {
        .livrea-panel {
          scroll-snap-align: none !important;
          min-height: auto !important;
          height: auto !important;
          padding: 24px 16px 32px !important;
          scroll-margin-top: var(--livrea-hud-height);
        }
        .livrea-panel-01 {
          padding-top: calc(var(--livrea-hud-height) + 20px) !important;
        }
        .livrea-panel-inner {
          min-height: auto !important;
          height: auto !important;
          justify-content: flex-start !important;
          gap: 16px !important;
        }
        .livrea-telemetry-header {
          padding-bottom: 8px;
          min-height: 24px;
        }
        .livrea-hero-center,
        .livrea-podium-container,
        .livrea-detail-block,
        .livrea-project-split-layout,
        .livrea-contact-center {
          margin-block: 0 !important;
        }
        /* Touch targets */
        .livrea-panel button,
        .livrea-panel [role="button"] {
          min-height: 44px;
        }
      }

      /* Section header: livery tick + number + name, quiet meta right */
      .livrea-telemetry-header {
        border-bottom: 1px solid var(--color-border);
        padding-bottom: 12px;
        min-height: 32px;
        flex-wrap: nowrap !important;
        gap: 12px !important;
      }
      .livrea-telemetry-left {
        min-width: 0 !important;
        flex: 1 1 auto !important;
        overflow: hidden;
      }
      .livrea-red-indicator {
        display: inline-block;
        width: 3px;
        height: 12px;
        font-size: 0;
        background-color: var(--color-text-red);
        border-radius: 1px;
        flex-shrink: 0;
      }
      .livrea-kicker-num {
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
      }
      .livrea-kicker {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .livrea-telemetry-badge {
        flex-shrink: 0;
        white-space: nowrap;
        color: var(--color-text-secondary) !important;
      }

      /* ---------------------------------------------------------------- */
      /* Type                                                              */
      /* ---------------------------------------------------------------- */
      .livrea-huge-name {
        font-family: var(--livrea-display);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.04em;
        font-size: clamp(3.5rem, 7vw, 6.5rem);
        margin: 0;
        color: var(--color-text-primary);
      }
      .livrea-section-head {
        font-family: var(--livrea-display);
        font-weight: 500;
        font-size: clamp(2rem, 3.2vw, 3rem);
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin: 0;
        color: var(--color-text-primary);
        max-width: 30ch;
      }
      .livrea-contact-head {
        max-width: 24ch;
      }
      .livrea-section-lead {
        font-size: 1.125rem;
        line-height: 1.55;
        max-width: 72ch;
      }
      .livrea-massive-title {
        font-family: var(--livrea-display);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.02em;
        font-size: clamp(2.25rem, 3.4vw, 3.25rem);
        margin: 0;
        color: var(--color-text-primary);
      }
      .livrea-card-title {
        font-family: var(--livrea-display);
        font-size: 1.125rem !important;
        font-weight: 500 !important;
        line-height: 1.3 !important;
        letter-spacing: 0;
        margin: 0;
        color: var(--color-text-primary);
      }

      @media (max-width: 819.98px), (pointer: coarse) {
        .livrea-huge-name {
          font-size: clamp(2.75rem, 12.5vw, 3.5rem);
        }
        .livrea-section-head {
          font-size: clamp(1.75rem, 7.5vw, 2.25rem);
        }
        .livrea-massive-title {
          font-size: clamp(2rem, 9vw, 2.5rem);
        }
        .livrea-section-lead {
          font-size: 1rem;
        }
      }

      /* ---------------------------------------------------------------- */
      /* 01 About                                                          */
      /* ---------------------------------------------------------------- */
      .livrea-role-strip {
        font-size: 1.0625rem;
        row-gap: 4px !important;
      }
      .livrea-manifesto-card {
        border-left: 2px solid var(--color-text-red);
        padding: 4px 0 4px 20px;
        max-width: 72ch;
      }
      .livrea-manifesto-text {
        font-size: clamp(1.25rem, 1.6vw, 1.5rem);
        line-height: 1.45;
        font-weight: 400;
        margin: 0;
        max-width: 48ch;
      }
      .livrea-manifesto-bio {
        font-size: 1rem;
        line-height: 1.6;
        margin: 0;
      }
      .livrea-kpi-grid {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: 24px !important;
        max-width: 1200px;
      }
      .livrea-kpi-box {
        border-top: 1px solid var(--color-border-emphasized);
        padding-top: 16px;
        min-width: 0;
        position: relative;
      }
      .livrea-kpi-box::before {
        content: '';
        position: absolute;
        top: -1px;
        left: 0;
        width: 24px;
        height: 2px;
        background: var(--color-text-red);
      }
      .livrea-kpi-value {
        font-family: var(--livrea-display);
        font-size: 1.75rem !important;
        font-weight: 500;
        line-height: 1.15 !important;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }
      .livrea-hero-links {
        column-gap: 20px !important;
        row-gap: 4px !important;
      }
      .livrea-hero-links a {
        font-size: 0.875rem;
      }
      @media (max-width: 819.98px), (pointer: coarse) {
        .livrea-role-strip {
          font-size: 0.9375rem;
          flex-direction: column !important;
          align-items: flex-start !important;
          row-gap: 0 !important;
        }
        .livrea-role-separator {
          display: none !important;
        }
        .livrea-manifesto-card {
          padding-left: 16px;
        }
        .livrea-manifesto-text {
          font-size: 1.1875rem;
        }
        .livrea-manifesto-bio {
          font-size: 0.9375rem;
        }
        .livrea-kpi-grid {
          grid-template-columns: 1fr;
          column-gap: 0 !important;
        }
        .livrea-kpi-box {
          display: grid !important;
          grid-template-columns: 1fr auto;
          column-gap: 12px;
          row-gap: 2px;
          align-items: baseline;
          padding: 12px 0;
        }
        .livrea-kpi-box > :nth-child(1) { grid-column: 1; grid-row: 1; }
        .livrea-kpi-box > :nth-child(2) { grid-column: 2; grid-row: 1; text-align: right; }
        .livrea-kpi-box > :nth-child(3) { grid-column: 1 / -1; grid-row: 2; }
        .livrea-kpi-value {
          font-size: 1.25rem !important;
        }
        .livrea-hero-links {
          column-gap: 20px !important;
        }
        .livrea-hero-links a {
          display: inline-flex;
          align-items: center;
          min-height: 44px;
          font-size: 0.9375rem;
        }
        .livrea-hero-links a:first-child {
          flex-basis: 100%;
        }
        /* The section bar already names section 01 */
        .livrea-panel-01 .livrea-telemetry-header {
          display: none !important;
        }
        .livrea-scroll-hint {
          display: none !important;
        }
      }

      /* ---------------------------------------------------------------- */
      /* Cards shared by 02, 06, 07, 09                                    */
      /* ---------------------------------------------------------------- */
      .livrea-podium-card,
      .livrea-system-split-box,
      .livrea-machinery-card,
      .livrea-contact-card {
        flex: 1 1 0;
        min-width: 0;
        background: var(--color-background-card);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 24px;
        transition: border-color 150ms var(--livrea-ease);
      }
      .livrea-podium-card:hover,
      .livrea-machinery-card:hover,
      .livrea-contact-card:hover {
        border-color: var(--color-border-emphasized);
      }
      .livrea-card-specs {
        border-top: 1px solid var(--color-border);
        padding-top: 12px;
        margin-top: auto;
      }
      .livrea-card-link {
        display: inline-flex;
        align-items: center;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        min-height: 24px;
      }
      .livrea-inline-link {
        text-decoration: underline;
        text-decoration-color: var(--color-border-emphasized);
        text-underline-offset: 3px;
      }
      .livrea-card-link:hover,
      .livrea-inline-link:hover,
      .livrea-hero-links a:hover {
        text-decoration: underline;
        text-decoration-color: var(--color-text-red);
        text-decoration-thickness: 2px;
        text-underline-offset: 4px;
      }

      /* 02 Hackathons */
      .livrea-podium-rank {
        font-family: var(--livrea-display);
        font-weight: 600;
        font-size: 2.5rem;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--color-text-secondary);
        font-variant-numeric: tabular-nums;
      }
      .livrea-podium-rank.is-winner {
        color: var(--color-text-red);
      }
      @media (max-width: 1024px) {
        .livrea-podium-cards {
          flex-direction: column !important;
        }
      }
      @media (max-width: 819.98px), (pointer: coarse) {
        .livrea-podium-card,
        .livrea-system-split-box,
        .livrea-machinery-card,
        .livrea-contact-card {
          padding: 16px;
        }
        .livrea-podium-rank {
          font-size: 2rem;
        }
        .livrea-card-link {
          min-height: 44px;
        }
      }

      /* ---------------------------------------------------------------- */
      /* 03–05 Flagship projects                                           */
      /* ---------------------------------------------------------------- */
      .livrea-project-split-layout {
        display: flex;
        gap: 64px !important;
      }
      .livrea-split-left-col {
        flex: 1 1 440px;
        max-width: 560px;
        min-width: 0;
      }
      .livrea-split-right-col {
        flex: 1.4 1 560px;
        max-width: 880px;
        min-width: 0;
      }
      @media (max-width: 1024px) {
        .livrea-project-split-layout {
          flex-direction: column !important;
          align-items: stretch !important;
          gap: 32px !important;
        }
        .livrea-split-left-col,
        .livrea-split-right-col {
          max-width: 100% !important;
          flex: none !important;
        }
      }
      @media (max-width: 819.98px), (pointer: coarse) {
        .livrea-project-split-layout {
          gap: 24px !important;
        }
      }
      .livrea-project-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        flex-shrink: 0;
        background: var(--color-background-muted);
        padding: 6px;
        border: 1px solid var(--color-border);
      }
      .livrea-garda-logo {
        height: 28px;
        width: auto;
        max-width: 120px;
        object-fit: contain;
      }
      .livrea-project-lead {
        font-size: 1.125rem;
        line-height: 1.5;
        margin: 0;
      }
      .livrea-role-badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--color-border-emphasized);
        color: var(--color-text-primary) !important;
        padding: 2px 8px;
        border-radius: 6px;
      }
      .livrea-pillars-list {
        border-top: 1px solid var(--color-border);
      }
      .livrea-pillar-item {
        padding: 12px 0;
        border-bottom: 1px solid var(--color-border);
      }
      .livrea-pillar-num {
        color: var(--color-text-red) !important;
        width: 24px;
        flex-shrink: 0;
        padding-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      .livrea-mockup-frame {
        background: var(--color-background-card);
        border: 1px solid var(--color-border-emphasized);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      }
      .livrea-mockup-titlebar {
        border-bottom: 1px solid var(--color-border);
        padding: 8px 12px;
        min-height: 36px;
      }
      .livrea-win-controls {
        display: flex;
        gap: 6px;
      }
      .livrea-win-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        font-size: 0;
        border-radius: 50%;
        background: rgba(236, 237, 239, 0.14);
        border: 0;
        transform: none !important;
        filter: none !important;
      }
      .livrea-win-title-text {
        font-weight: 400;
        font-size: inherit;
        letter-spacing: 0;
        color: var(--color-text-secondary);
        max-width: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .livrea-app-screenshot {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: var(--color-background-card);
      }
      .livrea-stage-caption {
        margin-top: 0;
        padding-top: 0;
      }
      .livrea-stage-caption-text {
        min-width: 0;
      }
      .livrea-stage-caption-meta {
        flex-shrink: 0;
        white-space: nowrap;
      }

      /* ---------------------------------------------------------------- */
      /* 06 Embedded & GIS                                                 */
      /* ---------------------------------------------------------------- */
      @media (max-width: 1024px) {
        .livrea-split-engineering {
          flex-direction: column !important;
        }
      }

      /* ---------------------------------------------------------------- */
      /* 07 More projects                                                  */
      /* ---------------------------------------------------------------- */
      .livrea-machinery-grid {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .livrea-machinery-card {
        padding: 20px;
      }
      .livrea-machinery-tech {
        flex-shrink: 0;
        white-space: nowrap;
      }
      .livrea-card-actions {
        margin-top: auto;
      }
      @media (max-width: 819.98px), (pointer: coarse) {
        .livrea-machinery-grid {
          grid-template-columns: 1fr;
        }
        .livrea-machinery-card {
          padding: 16px;
        }
        .livrea-card-actions {
          column-gap: 20px !important;
          row-gap: 0 !important;
        }
      }

      /* ---------------------------------------------------------------- */
      /* 08 Education: rows in one list                                    */
      /* ---------------------------------------------------------------- */
      .livrea-grid-rows {
        background: var(--color-background-card);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        overflow: hidden;
      }
      .livrea-grid-row {
        padding: 20px 24px;
      }
      .livrea-grid-row + .livrea-grid-row {
        border-top: 1px solid var(--color-border);
      }
      .livrea-grid-node-header {
        flex-shrink: 0;
        min-width: 200px;
        padding-top: 2px;
      }
      .livrea-grid-pos {
        font-variant-numeric: tabular-nums;
      }
      .livrea-grid-pos.is-current {
        color: var(--color-text-red);
      }
      @media (max-width: 819.98px), (pointer: coarse) {
        .livrea-grid-row {
          flex-direction: column !important;
          gap: 4px !important;
          padding: 16px;
        }
        .livrea-grid-node-header {
          min-width: 0;
          padding-top: 0;
        }
      }

      /* ---------------------------------------------------------------- */
      /* 09 Contact                                                        */
      /* ---------------------------------------------------------------- */
      .livrea-contact-lead {
        font-size: 1.125rem;
        line-height: 1.55;
        max-width: 64ch;
        margin: 0;
      }
      .livrea-contact-cards-desktop {
        display: flex;
      }
      .livrea-contact-card {
        justify-content: space-between;
      }
      .livrea-contact-action-deck {
        display: none !important;
      }
      @media (max-width: 1180px) and (min-width: 820px) {
        .livrea-contact-cards-desktop {
          display: grid !important;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 819.98px), (pointer: coarse) {
        .livrea-contact-lead {
          font-size: 1rem;
        }
        .livrea-contact-cards-desktop {
          display: none !important;
        }
        .livrea-contact-action-deck {
          display: flex !important;
          background: var(--color-background-card);
          border: 1px solid var(--color-border);
          border-radius: 12px;
          overflow: hidden;
        }
        .livrea-contact-deck-btn {
          display: flex;
          align-items: center;
          width: 100%;
          min-height: 64px;
          padding: 12px 16px;
          text-decoration: none !important;
          color: var(--color-text-primary);
          transition: background-color 150ms var(--livrea-ease);
          -webkit-tap-highlight-color: transparent;
        }
        .livrea-contact-deck-btn + .livrea-contact-deck-btn {
          border-top: 1px solid var(--color-border);
        }
        a.livrea-contact-deck-btn:active {
          background: var(--color-background-muted);
        }
        a.livrea-contact-deck-btn > * {
          flex: 1 1 auto;
          width: 100%;
        }
        .livrea-contact-deck-action {
          flex-shrink: 0;
        }
      }

      /* ---------------------------------------------------------------- */
      /* Bottom strips                                                     */
      /* ---------------------------------------------------------------- */
      .livrea-bottom-strip {
        border-top: 1px solid var(--color-border);
        padding-top: 12px;
        gap: 16px;
      }
      @media (max-width: 819.98px), (pointer: coarse) {
        /* Per-section meta strips repeat the header; drop them on phones */
        .livrea-intermediate-strip {
          display: none !important;
        }
        .livrea-hero-strip {
          padding-top: 4px;
        }
        .livrea-finish-strip {
          padding-top: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html,
        .livrea-snap-container {
          scroll-behavior: auto !important;
        }
        *,
        *::before,
        *::after {
          transition-duration: 0ms !important;
          animation-duration: 0ms !important;
        }
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
