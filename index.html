      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --font-mono: 'JetBrains Mono', monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        transition: background-color 0.25s ease, color 0.25s ease;
      }

      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 0;
        opacity: 0.6;
      }

      #root {
        position: relative;
        z-index: 1;
        width: 100%;
      }

      /* Micro-animations and tactile feedback */
      .astryx-card {
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                    border-color 0.2s ease;
      }

      .astryx-button {
        flex-shrink: 0;
        white-space: nowrap;
        transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 0.16s ease,
                    background-color 0.16s ease;
      }
      .astryx-button:hover {
        transform: translateY(-2px);
      }
      .astryx-button:active {
        transform: scale(0.98);
      }

      /* Headroom so translateY hover animation never clips against scrollable boundaries */
      .astryx-stack[data-scrollable="true"] {
        padding-block: 5px !important;
        margin-block: -3px !important;
      }

      .astryx-token {
        transition: transform 0.15s ease;
      }
      .astryx-token:hover {
        transform: scale(1.03);
      }

      /* Animated tab appearance */
      @keyframes tabFadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animated-tab-content {
        animation: tabFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Pulsing indicator */
      @keyframes pulseGlow {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.6;
          transform: scale(0.94);
        }
      }

      .pulse-indicator {
        animation: pulseGlow 2s infinite ease-in-out;
      }

      /* Terminal Cursor */
      @keyframes terminalBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .terminal-cursor {
        display: inline-block;
        width: 8px;
        height: 15px;
        background-color: currentColor;
        vertical-align: middle;
        margin-left: 4px;
        animation: terminalBlink 1s infinite;
      }

      /* Scrollbar refinements */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(150, 150, 150, 0.3);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(150, 150, 150, 0.5);
      }

      /* Mobile responsiveness optimizations */
      @media (max-width: 768px) {
        html, body, #root {
          max-width: 100vw;
          overflow-x: hidden;
        }

        /* Prevent desktop padding from crushing mobile content */
        .astryx-card {
          padding: 14px !important;
        }

        .astryx-section {
          padding-inline: 12px !important;
          padding-block: 10px !important;
        }

        /* Grids collapse cleanly to single-column on mobile with no overflow */
        .astryx-grid {
          grid-template-columns: 1fr !important;
          gap: 12px !important;
          max-width: 100% !important;
          min-width: 0 !important;
        }

        /* Ensure all stacks and code containers respect mobile width */
        .astryx-stack,
        .astryx-stack-item,
        .astryx-code-block,
        pre {
          min-width: 0 !important;
          max-width: 100% !important;
        }

        /* Smooth horizontal touch scroll strip for Astryx isScrollable stacks */
        .astryx-stack[data-scrollable="true"] {
          display: flex !important;
          overflow-x: auto !important;
          overflow-y: hidden !important;
          flex-wrap: nowrap !important;
          width: 100% !important;
          max-width: 100% !important;
          gap: 6px !important;
          padding-block: 5px !important;
          margin-block: -3px !important;
          -webkit-overflow-scrolling: touch !important;
          scrollbar-width: none !important;
        }

        .astryx-stack[data-scrollable="true"]::-webkit-scrollbar {
          display: none !important;
        }

        .astryx-stack[data-scrollable="true"] > * {
          flex-shrink: 0 !important;
        }

        /* Hide desktop-only clock in top bar on narrow mobile view */
        .astryx-section:first-child .astryx-token[data-color="gray"] {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bg-canvas"></canvas>
    <div id="root"></div>

    <script>
      // Kinetic particle & digital grid backdrop
      (function() {
        const canvas = document.getElementById('bg-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = 0;
        let height = 0;
        let particles = [];
        let mouseX = -9999;
        let mouseY = -9999;

        function resize() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          initParticles();
        }

        function initParticles() {
          particles = [];
          const count = Math.min(Math.floor((width * height) / 18000), 65);
          for (let i = 0; i < count; i++) {
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              vx: (Math.random() - 0.5) * 0.35,
              vy: (Math.random() - 0.5) * 0.35,
              radius: Math.random() * 1.5 + 0.8,
            });
          }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', function(e) {
          mouseX = e.clientX;
          mouseY = e.clientY;
        });
        window.addEventListener('mouseout', function() {
          mouseX = -9999;
          mouseY = -9999;
        });

        resize();

        function draw() {
          ctx.clearRect(0, 0, width, height);

          // Check if dark theme
          const isDark = document.body.classList.contains('astryx-theme-dark') ||
            window.getComputedStyle(document.body).backgroundColor.includes('rgb(9') ||
            window.getComputedStyle(document.body).backgroundColor.includes('rgb(8') ||
            window.getComputedStyle(document.body).backgroundColor.includes('rgb(13') ||
            window.matchMedia('(prefers-color-scheme: dark)').matches;

          const dotColor = isDark ? 'rgba(56, 189, 248, 0.45)' : 'rgba(14, 116, 144, 0.35)';
          const lineColor = isDark ? 'rgba(56, 189, 248, ' : 'rgba(14, 116, 144, ';
          const gridColor = isDark ? 'rgba(255, 255, 255, 0.015)' : 'rgba(0, 0, 0, 0.02)';

          // Subtle background grid
          const gridSize = 52;
          ctx.beginPath();
          ctx.strokeStyle = gridColor;
          ctx.lineWidth = 1;
          for (let x = 0; x < width; x += gridSize) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
          }
          for (let y = 0; y < height; y += gridSize) {
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
          }
          ctx.stroke();

          // Move and draw particles
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = dotColor;
            ctx.fill();

            // Connect nearby particles
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p.x - p2.x;
              const dy = p.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 120) {
                const alpha = (1 - dist / 120) * 0.16;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = lineColor + alpha + ')';
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }

            // Mouse proximity glow
            const mdx = p.x - mouseX;
            const mdy = p.y - mouseY;
            const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
            if (mdist < 140) {
              const malpha = (1 - mdist / 140) * 0.35;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(mouseX, mouseY);
              ctx.strokeStyle = (isDark ? 'rgba(99, 102, 241, ' : 'rgba(79, 70, 229, ') + malpha + ')';
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }

          requestAnimationFrame(draw);
        }

        draw();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
