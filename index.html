    <style>
      :root {
        --font-mono: 'Geist Mono', monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        background-color: #0A0B0D;
      }

      body {
        margin: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        background-color: #0A0B0D;
        color: #FFFFFF;
        font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        min-height: 100vh;
        background-color: #0A0B0D;
      }

      /* Clean subtle scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0A0B0D;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #E10600;
      }

      /* ========================================================================= */
      /* LIVREA MOTORSPORT SYSTEM */
      /* ========================================================================= */

      :root {
        --color-tech-cyan: #00E5FF;
        --color-tech-cyan-dim: rgba(0, 229, 255, 0.12);
        --color-tech-cyan-border: rgba(0, 229, 255, 0.35);
      }
      .livrea-text-cyan {
        color: #00E5FF !important;
      }
      .livrea-badge-cyan {
        background: rgba(0, 229, 255, 0.1) !important;
        border: 1px solid rgba(0, 229, 255, 0.35) !important;
        color: #00E5FF !important;
      }

      /* Dynamic Lightweight Telemetry Canvas Background */
      .livrea-telemetry-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 0;
      }

      .livrea-snap-container {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
        background-color: transparent;
      }

      /* Desktop viewports >= 820px with fine pointer retain inner container scroll-snapping */
      @media (min-width: 820px) and (pointer: fine) {
        html, body {
          height: 100%;
          overflow: hidden;
        }
        .livrea-snap-container {
          height: 100vh;
          overflow-y: scroll;
          scroll-snap-type: y mandatory;
        }
      }

      /* Mobile viewports < 820px or touch-coarse devices: root document handles scrolling */
      @media (max-width: 819.98px), (pointer: coarse) {
        html {
          height: auto;
          min-height: 100%;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }
        body {
          height: auto;
          min-height: 100%;
          overflow-y: visible;
          overflow-x: hidden;
        }
        #root {
          height: auto;
          min-height: 100%;
        }
        .livrea-snap-container {
          height: auto !important;
          min-height: 100% !important;
          overflow: visible !important;
          overflow-y: visible !important;
          scroll-snap-type: none !important;
          -webkit-overflow-scrolling: auto !important;
        }
        .livrea-panel {
          scroll-snap-align: none !important;
          min-height: auto !important;
          height: auto !important;
          scroll-margin-top: 56px;
        }
        .livrea-panel-inner {
          min-height: auto !important;
          height: auto !important;
          justify-content: flex-start !important;
          gap: 12px !important;
        }
        .livrea-panel-01 {
          padding-top: calc(48px + 18px) !important;
        }

        /* WCAG Touch Target Accessibility: min 44x44px for primary buttons and touch controls */
        button,
        [role="button"],
        .livrea-btn {
          min-height: 44px;
          min-width: 44px;
          box-sizing: border-box;
        }

        .livrea-bottom-strip a,
        .livrea-hero-strip a {
          min-height: 36px;
          display: inline-flex;
          align-items: center;
          padding: 4px 6px;
        }
      }

      /* Lap progress bar at fixed top */
      .livrea-progress-track {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }
      .livrea-progress-bar {
        height: 100%;
        background-color: #E10600;
        box-shadow: 0 0 10px rgba(225, 6, 0, 0.7);
        transition: width 0.08s linear;
      }

      /* Circuit Sector Quick-Jump Nav on Desktop Right */
      .livrea-quick-nav {
        position: fixed;
        right: 24px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 990;
        background: rgba(14, 15, 18, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 8px 6px;
        backdrop-filter: blur(12px);
      }
      @media (min-width: 820px) and (pointer: fine) {
        .livrea-quick-nav {
          display: flex !important;
        }
      }
      @media (max-width: 819.98px), (pointer: coarse) {
        .livrea-quick-nav {
          display: none !important;
        }
      }
      .livrea-nav-dot {
        display: block;
        padding: 3px 6px;
        border-radius: 3px;
        text-decoration: none;
        transition: all 0.15s ease;
      }
      .livrea-nav-dot:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .livrea-nav-dot.is-active {
        background: rgba(225, 6, 0, 0.25);
        border: 1px solid #E10600;
      }

      /* Mobile Telemetry Waypoint HUD & Quick-Jump Navigation */
      .livrea-mobile-hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 998;
        background: rgba(10, 10, 14, 0.96);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      }
      @media (min-width: 820px) and (pointer: fine) {
        .livrea-mobile-hud {
          display: none !important;
        }
      }
      .livrea-mobile-hud-bar {
        min-height: 44px;
        padding: 2px 12px;
      }
      .livrea-hud-kicker-btn {
        min-height: 44px;
        min-width: 44px;
        background: transparent !important;
        border: none !important;
        padding: 4px 8px !important;
        border-radius: 4px;
        cursor: pointer;
      }
      .livrea-hud-kicker-btn:active,
      .livrea-hud-kicker-btn:focus-visible {
        background: rgba(255, 255, 255, 0.08) !important;
      }
      .livrea-hud-kicker-badge {
        background: rgba(225, 6, 0, 0.2);
        border: 1px solid rgba(225, 6, 0, 0.45);
        border-radius: 3px;
        padding: 2px 6px;
        letter-spacing: 0.05em;
      }
      .livrea-hud-kicker-title {
        letter-spacing: 0.08em;
      }
      .livrea-hud-kicker-chevron {
        font-size: 13px;
        margin-left: 2px;
      }
      .livrea-hud-actions {
        flex-shrink: 0;
      }
      .livrea-hud-lap-counter {
        opacity: 0.6;
        min-width: 32px;
        text-align: right;
      }
      .livrea-hud-contact-shortcut {
        min-height: 44px;
        min-width: 44px;
        padding: 6px 10px !important;
        background: rgba(225, 6, 0, 0.16) !important;
        border: 1px solid rgba(225, 6, 0, 0.65) !important;
        border-radius: 4px;
        transition: all 0.15s ease;
      }
      .livrea-hud-contact-shortcut:hover,
      .livrea-hud-contact-shortcut:active {
        background: rgba(225, 6, 0, 0.3) !important;
        border-color: #E10600 !important;
      }

      /* Waypoint Drawer / Dropdown Ribbon */
      .livrea-hud-drawer {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(12, 13, 17, 0.98);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-bottom: 2px solid #E10600;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
        padding: 12px 14px 18px 14px;
        max-height: calc(100svh - 58px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .livrea-hud-drawer-header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 8px;
        margin-bottom: 4px;
      }
      .livrea-hud-close-btn {
        min-height: 44px;
        min-width: 44px;
        padding: 4px 8px !important;
      }
      .livrea-hud-sector-list {
        display: flex;
        flex-direction: column;
      }
      .livrea-hud-sector-btn {
        width: 100%;
        min-height: 48px;
        padding: 8px 12px !important;
        border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        background: rgba(255, 255, 255, 0.03) !important;
        text-align: left;
        cursor: pointer;
        transition: all 0.12s ease;
      }
      .livrea-hud-sector-btn:active,
      .livrea-hud-sector-btn:hover {
        background: rgba(255, 255, 255, 0.08) !important;
        border-color: rgba(255, 255, 255, 0.2) !important;
      }
      .livrea-hud-sector-btn.is-active {
        background: rgba(225, 6, 0, 0.18) !important;
        border-color: #E10600 !important;
      }
      .livrea-hud-sector-pill {
        display: inline-block;
        padding: 3px 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.06);
        font-weight: 700;
      }
      .livrea-hud-sector-btn.is-active .livrea-hud-sector-pill {
        background: #E10600;
        color: #FFFFFF !important;
      }
      .livrea-hud-sector-name {
        letter-spacing: 0.06em;
      }
      .livrea-hud-sector-desc {
        opacity: 0.7;
        font-size: 11px;
      }
      .livrea-hud-active-flag {
        letter-spacing: 0.05em;
        font-weight: 700;
      }
      .livrea-hud-jump-arrow {
        opacity: 0.5;
        font-size: 14px;
      }
      .livrea-hud-bottom-contact {
        width: 100%;
        min-height: 48px;
        margin-top: 6px;
        background: linear-gradient(135deg, #E10600 0%, #b30500 100%) !important;
        border: none !important;
        border-radius: 5px;
        box-shadow: 0 4px 14px rgba(225, 6, 0, 0.4);
      }
      .livrea-hud-bottom-contact:hover,
      .livrea-hud-bottom-contact:active {
        background: linear-gradient(135deg, #f00700 0%, #c40500 100%) !important;
      }

      /* Common Panel Anatomy */
      .livrea-panel {
        scroll-snap-align: start;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
        padding: 16px 80px 16px 52px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        background-color: transparent;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      @media (min-width: 1025px) {
        .livrea-panel {
          padding: 22px 80px 22px 52px;
          min-height: 100vh;
        }
        .livrea-panel-inner {
          min-height: calc(100vh - 44px);
        }
      }
      @media (max-width: 1024px) {
        .livrea-panel {
          padding: 14px 22px;
          min-height: auto;
        }
        .livrea-panel-inner {
          min-height: auto;
        }
      }
      @media (max-width: 820px) {
        .livrea-panel {
          padding: 12px 16px !important;
          min-height: auto !important;
          height: auto !important;
          scroll-snap-align: none !important;
          scroll-margin-top: 56px;
        }
        .livrea-panel-01 {
          padding-top: calc(48px + 18px) !important;
        }
        .livrea-panel-inner {
          min-height: auto !important;
          height: auto !important;
          justify-content: flex-start !important;
          gap: 12px !important;
        }
      }
      @media (max-width: 480px) {
        .livrea-panel {
          padding: 10px 14px !important;
        }
        .livrea-panel-01 {
          padding-top: calc(48px + 16px) !important;
        }
      }
          gap: 1rem;
        }
      }

      /* Technical Livery Header */
      .livrea-telemetry-header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 6px;
        margin-bottom: 4px;
        min-height: 24px;
      }
      @media (max-width: 640px) {
        .livrea-telemetry-header {
          padding-bottom: 5px;
          gap: 6px;
          flex-wrap: wrap;
          align-items: flex-start;
        }
      }
      .livrea-red-indicator {
        display: inline-block;
        width: 6px;
        height: 18px;
        background-color: #E10600;
        border-radius: 1px;
      }
      .livrea-kicker {
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-family: var(--font-mono);
      }
      @media (max-width: 640px) {
        .livrea-kicker {
          font-size: 0.72rem;
          letter-spacing: 0.05em;
          max-width: 100%;
          white-space: normal;
          word-break: break-word;
          overflow: visible;
          text-overflow: clip;
          line-height: 1.35;
        }
      }
      .livrea-badge-num {
        font-family: 'Archivo', sans-serif;
        font-size: clamp(1.8rem, 4.5vw, 4rem);
        line-height: 1;
        letter-spacing: -0.03em;
        color: #E10600;
      }

      /* Big Typography */
      .livrea-huge-name {
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        line-height: 0.85;
        letter-spacing: -0.04em;
        font-size: clamp(3rem, 11vw, 9.5rem);
        margin: 0;
        color: #FFFFFF;
      }
      @media (max-width: 820px) {
        .livrea-huge-name {
          font-size: clamp(2.4rem, 10vw, 3.8rem);
          line-height: 0.88;
        }
        .livrea-massive-title {
          font-size: clamp(1.8rem, 6.5vw, 2.4rem);
        }
        .livrea-section-head {
          font-size: clamp(1.6rem, 5.5vw, 2.2rem);
        }
        .livrea-hero-center {
          margin-block: 6px 10px !important;
        }
        .livrea-role-strip {
          margin-block: 4px !important;
        }
        .livrea-manifesto-card {
          padding: 12px 14px !important;
          margin-block: 4px !important;
        }
        .livrea-manifesto-text {
          font-size: 0.95rem !important;
          line-height: 1.4 !important;
        }
      }
      @media (min-width: 1025px) {
        .livrea-hero-center,
        .livrea-detail-block,
        .livrea-project-split-layout,
        .livrea-podium-container,
        .livrea-contact-center {
          max-width: 1680px;
          width: 100%;
        }
        .livrea-huge-name {
          font-size: clamp(4.5rem, 9.5vw, 9.5rem);
        }
      }
      .livrea-massive-title {
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        line-height: 0.92;
        letter-spacing: -0.025em;
        font-size: clamp(2rem, 4.2vw, 3.8rem);
        margin: 0;
        color: #FFFFFF;
        word-break: break-word;
      }
      .livrea-split-left-col .livrea-massive-title {
        font-size: clamp(1.8rem, 3.2vw, 3rem);
      }
      .livrea-section-head {
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        font-size: clamp(1.8rem, 4vw, 3rem);
        text-transform: uppercase;
        letter-spacing: -0.02em;
        margin: 0;
        color: #FFFFFF;
      }

      /* Hero Panel 01 Details */
      .livrea-hero-center {
        margin-block: auto;
        width: 100%;
        max-width: 1550px;
      }
      .livrea-role-strip {
        font-size: 0.95rem;
        letter-spacing: 0.05em;
      }
      @media (max-width: 640px) {
        .livrea-role-strip {
          font-size: 0.78rem;
          gap: 0.35rem 0.6rem !important;
        }
      }
      .livrea-manifesto-card {
        background: #131418;
        border-left: 4px solid #E10600;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 22px 28px;
        border-radius: 0 4px 4px 0;
        max-width: 1300px;
      }
      @media (max-width: 640px) {
        .livrea-manifesto-card {
          padding: 16px 18px;
        }
        .livrea-manifesto-text {
          font-size: 1.05rem;
        }
      }
      .livrea-manifesto-text {
        font-size: clamp(1.2rem, 1.45vw, 1.45rem);
        line-height: 1.5;
        font-weight: 500;
      }
      .livrea-kpi-grid {
        margin-top: 10px;
      }
      .livrea-kpi-mobile {
        display: none !important;
      }
      .livrea-kpi-desktop {
        display: block !important;
      }
      @media (max-width: 820px) {
        .livrea-kpi-grid {
          display: grid !important;
          grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
          gap: 6px !important;
          margin-top: 6px !important;
          width: 100% !important;
        }
        .livrea-kpi-desktop {
          display: none !important;
        }
        .livrea-kpi-mobile {
          display: block !important;
        }
        .livrea-kpi-mobile-label {

          font-size: 0.62rem !important;

        }
        .livrea-kpi-mobile-val {
          font-size: clamp(0.75rem, 2.9vw, 1.05rem) !important;

        max-width: 1550px;

      .livrea-podium-mobile-summary {

        .livrea-podium-card.livrea-podium-p1 {

      .livrea-podium-card {
        flex: 1;
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 24px;
        border-radius: 4px;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      .livrea-podium-card:hover {
        border-color: rgba(255, 255, 255, 0.25);
      }

      /* Desktop Stage & Window Architecture (ANTEPRIME_FINESTRE) */
      .livrea-desktop-stage {

      .livrea-desktop-stage[data-dragging="true"] {
        user-select: none !important;
        -webkit-user-select: none !important;

      .livrea-desktop-stage[data-dragging="true"] iframe {
        pointer-events: none !important;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="move"] {
        cursor: grabbing;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="e"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="w"] {
        cursor: ew-resize;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="n"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="s"] {
        cursor: ns-resize;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="se"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="nw"] {
        cursor: nwse-resize;
      }
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="ne"],
      .livrea-desktop-stage[data-dragging="true"][data-drag-dir="sw"] {
        cursor: nesw-resize;
      }

      .livrea-desktop-window {

      .livrea-desktop-window.is-mobile {

      /* Internal 8-Direction Handles inside the border */
      .livrea-win-handle {
        position: absolute;
        z-index: 20;
        background: transparent;
        touch-action: none;
      }
      .livrea-win-handle-n { top: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
      .livrea-win-handle-s { bottom: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
      .livrea-win-handle-w { left: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }
      .livrea-win-handle-e { right: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }
      .livrea-win-handle-nw { top: 0; left: 0; width: 14px; height: 14px; cursor: nwse-resize; z-index: 22; }
      .livrea-win-handle-ne { top: 0; right: 0; width: 14px; height: 14px; cursor: nesw-resize; z-index: 22; }
      .livrea-win-handle-sw { bottom: 0; left: 0; width: 14px; height: 14px; cursor: nesw-resize; z-index: 22; }
      .livrea-win-handle-se {
        bottom: 0;
        right: 0;
        width: 16px;
        height: 16px;
        cursor: nwse-resize;
        z-index: 22;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 2px;
        outline: none;

      /* OS Resizable Window & 8-Direction Handles (Strict zero position shift) */
      .livrea-os-window {
        background: #0E0F14;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(225, 6, 0, 0.15);

      /* 8 Non-Shifting Collision Resize Handles */
      .livrea-handle {
        position: absolute;
        z-index: 40;
        background: transparent;
      }
      .handle-n {
        top: -6px;
        left: 12px;
        right: 12px;
        height: 12px;
        cursor: ns-resize;
      }
      .handle-s {
        bottom: -6px;
        left: 12px;
        right: 12px;
        height: 12px;
        cursor: ns-resize;
      }
      .handle-w {
        left: -6px;
        top: 12px;
        bottom: 12px;
        width: 12px;
        cursor: ew-resize;
      }
      .handle-e {
        right: -6px;
        top: 12px;
        bottom: 12px;
        width: 12px;
        cursor: ew-resize;
      }
      .handle-nw {
        top: -8px;
        left: -8px;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
        z-index: 45;
      }
      .handle-ne {
        top: -8px;
        right: -8px;
        width: 18px;
        height: 18px;
        cursor: nesw-resize;
        z-index: 45;
      }
      .handle-sw {
        bottom: -8px;
        left: -8px;
        width: 18px;
        height: 18px;
        cursor: nesw-resize;
        z-index: 45;
      }
      .handle-se {
        bottom: -8px;
        right: -8px;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
        z-index: 45;
      }
      .handle-n:hover, .handle-s:hover, .handle-w:hover, .handle-e:hover {
        background: rgba(225, 6, 0, 0.25);
      }
      .handle-nw:hover, .handle-ne:hover, .handle-sw:hover, .handle-se:hover {
        background: rgba(225, 6, 0, 0.5);

      .sf-subtitle-rendered {
        color: #FFE600;
        font-size: 1.05rem;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
        margin-top: 18px;
      }

      /* Oxide Desktop Styles */
      .ox-app-root {
        background: #0D0E12;
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .ox-toast-bar {
        background: rgba(225, 6, 0, 0.22);
        border-bottom: 1px solid #E10600;
        padding: 3px 10px;
      }
      .ox-app-menubar {
        background: #090A0D;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 5px 12px;
        min-height: 30px;
      }
      .ox-diff-pill {
        background: rgba(39, 201, 63, 0.15);
        color: #27C93F;
        padding: 1px 6px;
        border-radius: 2px;
        font-size: 0.65rem;
      }
      .ox-commit-btn {
        background: #E10600 !important;
        color: #FFFFFF !important;
        font-weight: 800 !important;
        font-size: 0.66rem !important;
        height: 24px !important;
        padding: 0 8px !important;
      }
      .ox-workspace-split {
        height: calc(100% - 30px);
      }
      .ox-threads-col {
        width: 175px;
        flex-shrink: 0;
        background: #090A0E;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px;
        box-sizing: border-box;
      }
      .ox-sidebar-head {
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .ox-threads-list {
        flex: 1;
        overflow-y: auto;
      }
      .ox-thread-item {
        padding: 5px 6px;
        border-radius: 3px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .ox-thread-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .ox-thread-item.is-active {
        background: rgba(225, 6, 0, 0.18);
        border-left: 2px solid #E10600;
      }
      .ox-chat-col {
        flex: 1;
        background: #0C0D11;
        padding: 8px 12px;
        box-sizing: border-box;
      }
      .ox-chat-header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 4px;
      }
      .ox-messages-scroll {
        flex: 1;
        overflow-y: auto;
        padding-right: 4px;
      }
      .ox-user-bubble {
        background: #14151B;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 10px;
        border-radius: 4px;
      }
      .ox-agent-bubble {
        background: #111217;
        border-left: 2px solid #E10600;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 10px;
        border-radius: 0 4px 4px 0;
      }
      .ox-turn-gate-box {
        background: #090A0D;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 6px 8px;
        border-radius: 3px;
        margin-top: 4px;
      }
      .ox-input-bar {
        background: #14151B;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        padding: 4px 8px;
      }
      .ox-diff-col {
        width: 170px;
        flex-shrink: 0;
        background: #0A0B0E;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px;
        box-sizing: border-box;
      }
      .ox-diff-head {
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding-bottom: 4px;
      }
      .ox-diff-content {
        flex: 1;
        overflow-y: auto;
        font-family: var(--font-mono);
        font-size: 0.65rem;
      }
      .ox-diff-del {
        color: #FF5F56 !important;
        background: rgba(255, 95, 86, 0.1);
        padding: 1px 2px;
      }
      .ox-diff-add {
        color: #27C93F !important;
        background: rgba(39, 201, 63, 0.1);
        padding: 1px 2px;
      }
      .ox-cta-btn {
        background: #E10600 !important;
        color: #FFFFFF !important;
        font-weight: 800 !important;
        font-size: 0.68rem !important;
        height: 24px !important;
        padding: 0 10px !important;
      }
      .ox-mini-btn {
        font-size: 0.65rem !important;
        height: 22px !important;
        padding: 0 6px !important;
      }

      /* scrobbl.rs Dashboard Styles */
      .sc-app-root {
        background: #0C0D11;
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .sc-toast-bar {
        background: rgba(225, 6, 0, 0.22);
        border-bottom: 1px solid #E10600;
        padding: 3px 10px;
      }
      .sc-app-menubar {
        background: #090A0E;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 12px;
        min-height: 32px;
      }
      .sc-period-btn {
        font-size: 0.65rem !important;
        height: 22px !important;
        padding: 0 6px !important;
        border-radius: 3px !important;
      }
      .sc-period-btn.is-active {
        background: rgba(225, 6, 0, 0.25) !important;
        border: 1px solid #E10600 !important;
        color: #FFFFFF !important;
      }
      .sc-dashboard-body {
        padding: 10px 14px;
        box-sizing: border-box;
        height: calc(100% - 32px);
      }
      .sc-kpi-row {
        margin-block: 2px;
      }
      .sc-kpi-card {
        flex: 1;
        background: #111217;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 12px;
        border-radius: 4px;
      }
      .sc-kpi-val {
        font-family: 'Archivo', sans-serif;
        font-size: 1.4rem;
        letter-spacing: -0.02em;
        line-height: 1;
        margin-bottom: 2px;
      }
      .sc-top-artists-box {
        background: #090A0E;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 10px;
        border-radius: 4px;
      }
      .sc-artist-bars {
        margin-top: 4px;
      }
      .sc-artist-row {
        padding: 2px 0;
      }
      .sc-bar-track {
        flex: 1;
        height: 6px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 3px;
        overflow: hidden;
        margin-inline: 8px;
      }
      .sc-bar-fill {
        height: 100%;
        background: #E10600;
        border-radius: 3px;
      }
      .sc-dashboard-footer {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 6px;
      }
      .sc-cta-btn {
        background: #E10600 !important;
        color: #FFFFFF !important;
        font-weight: 800 !important;
        font-size: 0.68rem !important;
        height: 24px !important;
        padding: 0 10px !important;
      }

      .livrea-primary-action-btn {
        background: #E10600 !important;
        color: #FFFFFF !important;
        font-weight: 800 !important;
        border: none !important;
        margin-bottom: 4px;
      }

      /* Sector 06 (Embedded & GIS) Split Architecture Cards */
      .livrea-split-engineering {
        margin-top: 8px;
      }
      .livrea-system-split-box {
        flex: 1;
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 4px;
        box-sizing: border-box;
      }
      @media (max-width: 820px) {
        .livrea-split-engineering {
          flex-direction: column !important;
          gap: 1.25rem !important;
          width: 100% !important;
        }
        .livrea-system-split-box {
          width: 100% !important;
          padding: 16px 14px !important;
          box-sizing: border-box !important;
          flex: none !important;
        }
        .livrea-system-split-box .livrea-card-specs {
          padding: 10px 12px !important;
          font-size: 0.8125rem !important;
          line-height: 1.45 !important;
          word-break: break-word;
        }
        .livrea-system-split-box h3 {
          font-size: 1.15rem !important;
          line-height: 1.3 !important;
        }
      }

      /* Panel 07 Machinery Grid */
      .livrea-machinery-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        width: 100%;
        margin-top: 6px;
      }
      .livrea-machinery-card {
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px 18px;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
        box-sizing: border-box;
        transition: border-color 0.15s ease;
      }
      .livrea-machinery-card:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }
      .livrea-card-action-btn {
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #E10600;
        font-weight: bold;
        font-size: 0.875rem;
      }
      .livrea-card-action-btn:hover {
        text-decoration: underline;
      }
      .livrea-card-status-note {
        display: inline-flex;
        align-items: center;
        font-size: 0.8rem;
        color: var(--color-text-secondary);
      }
      @media (max-width: 820px) {
        .livrea-machinery-grid {
          grid-template-columns: 1fr;
          gap: 10px;
          margin-top: 4px;
        }
        .livrea-machinery-card {
          padding: 12px 14px;
          gap: 8px;
        }
        .livrea-machinery-card .livrea-machinery-desc {
          font-size: 0.85rem;
          line-height: 1.4;
        }
        .livrea-card-action-btn {
          min-height: 44px;
          min-width: 44px;
          display: flex !important;
          align-items: center;
          justify-content: space-between;
          width: 100%;
          padding: 10px 14px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 4px;
          box-sizing: border-box;
          color: #fff;
          text-decoration: none !important;
        }
        .livrea-card-action-btn:active {
          background: rgba(225, 6, 0, 0.15);
          border-color: #E10600;
        }
        .livrea-card-status-note {
          min-height: 38px;
          padding: 4px 0;
        }
      }

      /* Panel 08 Starting Grid & Telemetry Timeline */
      .livrea-grid-rows {
        margin-top: 8px;
        position: relative;
      }
      .livrea-grid-row {
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 16px 24px;
        border-radius: 4px;
        transition: border-color 0.15s ease;
        position: relative;
      }
      .livrea-grid-row:hover {
        border-color: rgba(225, 6, 0, 0.4);
      }
      .livrea-grid-pos {
        font-family: var(--font-mono);
        font-weight: 900;
        font-size: 1.3rem;
        width: 50px;
        flex-shrink: 0;
      }
      @media (max-width: 820px) {
        .livrea-grid-timeline {
          position: relative;
          padding-left: 28px !important;
          margin-left: 4px;
        }
        /* Continuous vertical timeline track line */
        .livrea-grid-timeline::before {
          content: '';
          position: absolute;
          left: 10px;
          top: 18px;
          bottom: 24px;
          width: 2px;
          background: linear-gradient(180deg, #E10600 0%, rgba(225, 6, 0, 0.5) 60%, rgba(255, 255, 255, 0.2) 100%);
          z-index: 1;
        }
        /* Telemetry node item */
        .livrea-timeline-node {
          position: relative;
          margin-bottom: 8px;
        }
        /* Telemetry node marker */
        .livrea-timeline-node::before {
          content: '';
          position: absolute;
          left: -23px;
          top: 18px;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #0D0E11;
          border: 2px solid #E10600;
          box-shadow: 0 0 6px rgba(225, 6, 0, 0.7);
          z-index: 2;
        }
        .livrea-timeline-node.is-active-node::before {
          background: #E10600;
          box-shadow: 0 0 10px rgba(225, 6, 0, 0.95);
        }
        .livrea-grid-row {
          flex-direction: column !important;
          align-items: flex-start !important;
          gap: 6px !important;
          padding: 14px 16px !important;
        }
        .livrea-grid-pos {
          width: auto;
          font-size: 1.1rem;
        }
      }

      /* Sector 09 Contact Section & Ergonomic Action Deck */
      .livrea-contact-center {
        margin-block: auto;
        width: 100%;
        max-width: 1550px;
      }
      .livrea-contact-lead {
        font-size: clamp(1.15rem, 1.35vw, 1.35rem);
        line-height: 1.55;
        max-width: 1000px;
      }
      .livrea-contact-cards-grid {
        margin-top: 10px;
      }
      .livrea-contact-cards-desktop {
        display: flex;
      }
      .livrea-contact-action-deck {
        display: none;
      }
      .livrea-contact-card {
        flex: 1;
        background: #131418;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 22px;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 10px;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .livrea-contact-card:hover {
        border-color: rgba(255, 255, 255, 0.25);
      }
      .livrea-contact-card.is-primary-action {
        border-color: #E10600;
        background: linear-gradient(180deg, rgba(225, 6, 0, 0.1) 0%, rgba(19, 20, 24, 0.98) 100%);
      }

      @media (max-width: 820px) {
        .livrea-contact-cards-desktop {
          display: none !important;
        }
        .livrea-contact-action-deck {
          display: flex !important;
          flex-direction: column;
          gap: 10px;
          width: 100%;
          margin-top: 8px;
        }
        .livrea-contact-deck-item {
          width: 100%;
        }
        .livrea-contact-deck-btn {
          width: 100%;
          min-height: 52px;
          padding: 12px 16px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: #131418;
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 4px;
          box-sizing: border-box;
          color: var(--color-text-primary);
          text-decoration: none;
          transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
          user-select: none;
          -webkit-tap-highlight-color: transparent;
        }
        .livrea-contact-deck-btn:active {
          transform: scale(0.99);
        }
        .livrea-contact-deck-btn.is-primary-deck-action {
          border-color: #E10600;
          background: linear-gradient(135deg, rgba(225, 6, 0, 0.2) 0%, rgba(19, 20, 24, 0.95) 100%);
          box-shadow: 0 0 12px rgba(225, 6, 0, 0.15);
        }
        .livrea-contact-deck-btn.is-primary-deck-action:hover,
        .livrea-contact-deck-btn.is-primary-deck-action:active {
          border-color: #ff2a24;
          background: linear-gradient(135deg, rgba(225, 6, 0, 0.3) 0%, rgba(19, 20, 24, 1) 100%);
        }
        .livrea-contact-deck-btn:hover {
          border-color: rgba(255, 255, 255, 0.3);
          background: #1a1b20;
        }
        .livrea-contact-toast {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 3px 8px;
          background: #E10600;
          color: #fff;
          font-family: var(--font-mono);
          font-size: 0.75rem;
          font-weight: bold;
          border-radius: 2px;
          letter-spacing: 0.05em;
          box-shadow: 0 0 8px rgba(225, 6, 0, 0.6);
          animation: livrea-toast-pulse 0.2s ease-out;
        }
        @keyframes livrea-toast-pulse {
          0% { transform: scale(0.92); opacity: 0; }
          100% { transform: scale(1); opacity: 1; }
        }
      }

      /* Bottom Navigation Strip — cleanly aligned with content margins */
      .livrea-bottom-strip {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 8px;
        padding-left: 0;
        margin-top: 10px;
      }
      @media (max-width: 820px) {
        .livrea-bottom-strip {
          flex-direction: column !important;
          align-items: flex-start !important;
          gap: 4px !important;
          padding-top: 6px !important;
          padding-bottom: 2px !important;
          margin-top: 8px !important;
        }
        .livrea-bottom-strip a,
        .livrea-hero-strip a {
          min-height: 32px !important;
          padding: 3px 6px !important;
          font-size: 0.8rem !important;
        }
        .livrea-hero-strip .livrea-email-link {
          color: #FFFFFF !important;
        }
        /* Consolidate repetitive intermediate strips on mobile to prevent visual noise */
        .livrea-intermediate-strip {
          display: none !important;
        }
        .livrea-scroll-hint {
          display: none !important;
        }
      }
      .livrea-scroll-hint {
        letter-spacing: 0.08em;
      }
    </style>
  </head>

    <div id="root"></div>

  </body>
